name: Notifications de prière

on:
  schedule:
    # Toutes les 15 minutes. GitHub peut retarder légèrement l'exécution
    # en période de forte charge — c'est normal, la fenêtre de tolérance
    # dans notify-worker/index.js absorbe ce petit décalage.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet "Actions"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notify-worker/package.json

      - name: Installer les dépendances
        working-directory: notify-worker
        run: npm install --omit=dev

      - name: Envoyer les notifications de prière
        working-directory: notify-worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node index.js
