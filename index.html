    { id: 1, name: "Adam", arabic: "\u0622\u062F\u064E\u0645", phonetic: "\xC2dam", trans: "Adam", desc: "Le premier des hommes et premier proph\xE8te", icon: "\u{1F33F}", color: "#00ff88", story: [
      { title: "La cr\xE9ation d'Adam", text: "Allah cr\xE9a Adam \xE0 partir de terre, lui donna la plus belle des formes et insuffla en lui Son esprit. Les anges, sur ordre d'Allah, se prostern\xE8rent tous devant lui en signe d'honneur. Iblis (Shaytan) refusa avec arrogance : 'Je suis meilleur que lui \u2014 Tu m'as cr\xE9\xE9 de feu et lui d'argile.' Cette d\xE9sob\xE9issance le fit chasser du Paradis pour toujours." },
      { title: "L'enseignement des noms", text: "Allah enseigna \xE0 Adam le nom de toutes choses \u2014 une connaissance que les anges ne poss\xE9daient pas. Quand Allah leur demanda de les nommer, ils avou\xE8rent leur ignorance. Adam les nomma tous, prouvant sa sup\xE9riorit\xE9 par le savoir que lui avait accord\xE9 Allah." },
      { title: "Le Jardin et l'\xE9preuve", text: "Allah installa Adam et son \xE9pouse Hawwa au Jardin, leur accordant tout en libert\xE9 sauf un arbre interdit. Shaytan les trompa en leur murmurant de fausses promesses d'immortalit\xE9. Ils c\xE9d\xE8rent, go\xFBt\xE8rent du fruit d\xE9fendu, puis se repentirent sinc\xE8rement. Allah leur pardonna mais les fit descendre sur Terre pour y vivre leur vie." },
      { title: "Le premier proph\xE8te de la Terre", text: "Adam devint le premier proph\xE8te sur Terre. Il enseigna \xE0 ses enfants la foi en Allah Seul, le bien et le mal, les rites religieux. Il transmit la guidance divine \xE0 l'humanit\xE9. Son fils Qabil tua son fr\xE8re Habil par jalousie \u2014 le premier meurtre de l'histoire. Adam v\xE9cut selon la tradition plus de 900 ans et mourut en ayant transmis la foi \xE0 sa descendance." }
    ] },
    { id: 2, name: "Idris", arabic: "\u0625\u0650\u062F\u0652\u0631\u0650\u064A\u0633", phonetic: "Idr\xEEs", trans: "H\xE9noch", desc: "Le proph\xE8te \xE9lev\xE9 en un lieu sublime", icon: "\u{1F4DC}", color: "#ffd700", story: [
      { title: "Un homme \xE9lev\xE9 par Allah", text: "Idris est mentionn\xE9 deux fois dans le Coran comme proph\xE8te v\xE9ridique et patient. Allah dit de lui : 'Nous l'avons \xE9lev\xE9 en un lieu sublime.' Selon la tradition islamique, il fut \xE9lev\xE9 au ciel de son vivant \u2014 une gr\xE2ce unique qu'Allah lui accorda en r\xE9compense de sa pi\xE9t\xE9 exceptionnelle." },
      { title: "Le savant pionnier", text: "Selon les r\xE9cits des savants, Idris fut l'un des premiers \xEAtres humains \xE0 \xE9crire avec la plume et \xE0 lire les \xE9crits. Il ma\xEEtrisait l'astronomie, les sciences des \xE9toiles, la couture et l'arithm\xE9tique. Il appela son peuple \xE0 adorer Allah Seul, \xE0 abandonner l'injustice et \xE0 s'\xE9loigner des vices. Sa patience face au rejet fut exemplaire." },
      { title: "Sa place parmi les proph\xE8tes", text: "Le Proph\xE8te Muhammad \uFDFA le rencontra lors du Voyage Nocturne (Isra' wal Mi'raj) au quatri\xE8me ciel. Idris est v\xE9n\xE9r\xE9 comme l'un des grands proph\xE8tes de la lign\xE9e d'Adam, avant le D\xE9luge de N\xFBh. Sa vie illustre que la pi\xE9t\xE9 et la science ne sont pas oppos\xE9es mais se compl\xE8tent dans l'Islam." }
    ] },
    { id: 3, name: "N\xFBh", arabic: "\u0646\u064F\u0648\u062D", phonetic: "Nouh", trans: "No\xE9", desc: "Le proph\xE8te de l'Arche \u2014 950 ans de mission", icon: "\u26F5", color: "#00cfff", story: [
      { title: "950 ans de da'wa sans rel\xE2che", text: "N\xFBh pr\xEAcha son peuple pendant 950 ans sans jamais se d\xE9courager. Il les appela le jour et la nuit, en public et en priv\xE9, avec douceur et avec fermet\xE9. Pourtant, seule une poign\xE9e de croyants r\xE9pondit \xE0 son appel. Les chefs de son peuple disaient : 'Il n'est qu'un menteur arrogant. Ceux qui le suivent sont les plus mis\xE9rables parmi nous !'" },
      { title: "La construction de l'Arche", text: "Sur ordre d'Allah, N\xFBh construisit une gigantesque arche en plein d\xE9sert, loin de toute mer. Les m\xE9cr\xE9ants se moquaient de lui ouvertement : 'Un charpentier devenu proph\xE8te !' N\xFBh r\xE9pondait avec calme et continuait \xE0 travailler. Quand l'arche fut termin\xE9e, Allah lui ordonna d'embarquer les croyants et un couple de chaque esp\xE8ce animale." },
      { title: "Le Grand D\xE9luge", text: "Le d\xE9luge frappa avec une violence inou\xEFe \u2014 les eaux jaillirent de la terre et tomb\xE8rent du ciel. Le fils de N\xFBh refusa de monter, disant qu'il se r\xE9fugierait sur une montagne. N\xFBh cria : 'Aujourd'hui rien ne prot\xE8ge du d\xE9cret d'Allah !' Son fils p\xE9rit. L'arche navigua sur des vagues comme des montagnes. Puis Allah ordonna \xE0 la terre d'absorber les eaux et l'arche s'immobilisa sur le mont Joudi." },
      { title: "Une nouvelle humanit\xE9", text: "Apr\xE8s le d\xE9luge, N\xFBh et les croyants descendirent de l'arche sur une Terre purifi\xE9e. Allah lui dit : 'Descends avec paix de Notre part.' N\xFBh est consid\xE9r\xE9 comme le deuxi\xE8me p\xE8re de l'humanit\xE9, car toute la descendance actuelle de l'humanit\xE9 vient de lui et de ses fils." }
    ] },
    { id: 4, name: "Hud", arabic: "\u0647\u064F\u0648\u062F", phonetic: "Houd", trans: "Hud", desc: "Proph\xE8te du puissant peuple 'Ad", icon: "\u{1F30A}", color: "#00ff88", story: [
      { title: "Le peuple 'Ad \u2014 orgueil et puissance", text: "Le peuple 'Ad vivait dans la r\xE9gion de l'Ahqaf (actuels \xC9mirats/Y\xE9men). C'\xE9tait une nation d'une puissance physique extraordinaire. Ils b\xE2tissaient des palais et des colonnes immenses dans les montagnes. Leur arrogance les faisait dire : 'Qui est plus fort que nous ?' Ils adoraient des idoles et s'\xE9taient d\xE9tourn\xE9s de la foi de leurs anc\xEAtres." },
      { title: "L'appel courageux de Hud", text: "Hud \xE9tait l'un des leurs \u2014 un homme respect\xE9 parmi le peuple 'Ad. Il les appela \xE0 adorer Allah Seul, \xE0 abandonner les idoles, \xE0 faire preuve d'humilit\xE9 et de gratitude. Il leur rappela les bienfaits d'Allah : la pluie, les richesses, les enfants. Les chefs le trait\xE8rent de 'fou' et de 'menteur'. Ils lui dirent : 'Nos dieux t'ont frapp\xE9 de d\xE9mence !'" },
      { title: "Le vent de la destruction", text: "Hud leur annon\xE7a le ch\xE2timent divin. Un nuage sombre apparut \xE0 l'horizon \u2014 ils crurent na\xEFvement que c'\xE9tait la pluie tant attendue. C'\xE9tait en r\xE9alit\xE9 un vent furieux et glacial qui allait les d\xE9truire. Le vent souffla pendant sept nuits et huit jours cons\xE9cutifs, r\xE9duisant le peuple 'Ad en n\xE9ant comme des troncs de palmiers creux. Seuls Hud et les croyants furent \xE9pargn\xE9s." }
    ] },
    { id: 5, name: "Salih", arabic: "\u0635\u064E\u0627\u0644\u0650\u062D", phonetic: "S\xE2lih", trans: "Salih", desc: "La chamelle d'Allah et le peuple Thamud", icon: "\u{1F42A}", color: "#ff6b6b", story: [
      { title: "Le peuple Thamud et leurs rochers", text: "Le peuple Thamud habitait Al-Hijr (actuelle r\xE9gion de Madain Salih en Arabie Saoudite) et se distinguait par son art de tailler les rochers pour en faire des demeures et des palais. Riches et puissants, ils \xE9taient cependant tomb\xE9s dans l'idol\xE2trie et l'injustice." },
      { title: "La chamelle miraculeuse d'Allah", text: "Le peuple Thamud demanda \xE0 Salih un signe miraculeux pour croire. Allah fit sortir une chamelle extraordinaire du rocher \u2014 un miracle incontestable. Allah leur ordonna : 'Ne lui faites aucun mal, laissez-la pa\xEEtre librement, sinon un ch\xE2timent douloureux vous atteindra.' Salih leur dit : 'Voici la chamelle d'Allah \u2014 c'est un signe pour vous.'" },
      { title: "Le crime impardonnable", text: "Les plus arrogants du peuple, pouss\xE9s par leur chef Qudaar ibn Salif, tu\xE8rent la chamelle de sang-froid. Ce fut leur sentence de mort. Salih leur annon\xE7a : 'Profitez encore trois jours chez vous, puis le ch\xE2timent vous atteindra.' Les trois jours pass\xE8rent dans l'insouciance. Le quatri\xE8me jour, un cri terrible d\xE9chira le ciel et une foudre les frappa tous \u2014 Thamud fut enti\xE8rement an\xE9anti." }
    ] },
    { id: 6, name: "Ibrahim", arabic: "\u0625\u0650\u0628\u0652\u0631\u064E\u0627\u0647\u0650\u064A\u0645", phonetic: "Ibr\xE2h\xEEm", trans: "Abraham", desc: "Khalilullah \u2014 L'Ami intime d'Allah", icon: "\u{1F525}", color: "#ffd700", story: [
      { title: "L'\xE9veil \xE0 la v\xE9rit\xE9", text: "Ibrahim grandit dans une famille d'idol\xE2tres \u2014 son p\xE8re Azar fabriquait et vendait des idoles. D\xE8s son jeune \xE2ge, son esprit vif remit en question ces croyances. Il observa les \xE9toiles, la lune, le soleil et raisonna : ces astres se couchent \u2014 ils ne peuvent \xEAtre des dieux. Il conclut : 'J'oriente mon visage vers Celui qui a cr\xE9\xE9 les cieux et la Terre.'" },
      { title: "La destruction des idoles", text: "Ibrahim brisa toutes les idoles du temple de son peuple sauf la plus grande sur laquelle il d\xE9posa sa hache. Quand les gens l'accus\xE8rent, il dit : 'Interrogez la grande idole puisqu'elle peut parler !' Les gens se regard\xE8rent et dirent : 'C'est Ibrahim qui l'a fait.' Ibrahim leur dit : 'Adorez-vous ce que vous avez taill\xE9 de vos propres mains alors qu'Allah vous a cr\xE9\xE9s ?'" },
      { title: "Dans le feu \u2014 le miracle divin", text: "Le roi Nemrod ordonna de jeter Ibrahim vivant dans un immense b\xFBcher allum\xE9 depuis des jours. On l'y lan\xE7a avec une catapulte. Allah dit au feu : 'Sois frais et agr\xE9able pour Ibrahim !' Ibrahim en ressortit sain et sauf, sans m\xEAme l'odeur de br\xFBl\xE9. Ce miracle \xE9branla certains c\u0153urs mais Nemrod persista dans son obstination." },
      { title: "Le sacrifice supr\xEAme", text: "Allah \xE9prouva Ibrahim par l'une des \xE9preuves les plus dures : ordonner en r\xEAve de sacrifier son fils Isma'il. Ibrahim informa son fils. Isma'il r\xE9pondit avec une foi remarquable : 'P\xE8re, fais ce qu'on t'ordonne. Tu me trouveras parmi les patients.' Au moment du sacrifice, Allah rempla\xE7a Isma'il par un b\xE9lier et dit : 'Ibrahim, tu as confirm\xE9 le r\xEAve. Nous r\xE9compensons ainsi les vertueux.' Cette \xE9preuve est comm\xE9mor\xE9e chaque ann\xE9e lors de la f\xEAte de l'A\xEFd Al-Adha." },
      { title: "La Ka'ba et la b\xE9n\xE9diction \xE9ternelle", text: "Ibrahim et son fils Isma'il construisirent ensemble la Ka'ba \xE0 La Mecque, en levant ses fondations et en priant : 'Seigneur, accepte ceci de nous, Tu entends tout et sais tout. Envoie parmi eux un Messager de leur sein.' Cette pri\xE8re fut exauc\xE9e 2600 ans plus tard avec la naissance du Proph\xE8te Muhammad \uFDFA." }
    ] },
    { id: 7, name: "Lut", arabic: "\u0644\u064F\u0648\u0637", phonetic: "Lout", trans: "Lot", desc: "Le neveu d'Ibrahim \u2014 Mission dans les cit\xE9s corrompues", icon: "\u{1F3D9}\uFE0F", color: "#ff8c00", story: [
      { title: "La mission de Lut dans Sodome", text: "Lut, neveu d'Ibrahim, fut envoy\xE9 dans les cit\xE9s de Sodome et ses environs, en Jordanie actuelle. Ces populations avaient sombr\xE9 dans des vices que nul peuple avant eux n'avait pratiqu\xE9s \u2014 notamment l'homosexualit\xE9. Lut les appela \xE0 Allah, les avertit du ch\xE2timent divin et leur demanda d'abandonner leurs pratiques. Il fut rejet\xE9 et raill\xE9." },
      { title: "Les anges visiteurs", text: "Un jour, des anges sous forme de jeunes hommes tr\xE8s beaux vinrent chez Lut comme h\xF4tes. La nouvelle se r\xE9pandit en ville et les habitants vinrent en masse avec de mauvaises intentions. Lut \xE9tait angoiss\xE9 pour ses h\xF4tes. Les anges lui dirent : 'Ne crains pas, nous sommes des messagers d'Allah. Pars cette nuit avec ta famille. Ne te retourne pas et ne t'arr\xEAte pas.'" },
      { title: "La destruction des cit\xE9s", text: "\xC0 l'aube, Allah retourna les cit\xE9s coupables sens dessus dessous et fit pleuvoir sur elles des pierres de terre cuite en pluie serr\xE9e. Toute la population fut an\xE9antie. Lut et ses filles furent sauv\xE9s. Sa femme, qui sympathisait avec les pervertis et trahissait Lut en les informant de ses h\xF4tes, p\xE9rit avec les autres. Cette histoire est un avertissement \xE9ternel dans le Coran contre les vices et l'injustice." }
    ] },
    { id: 8, name: "Isma'il", arabic: "\u0625\u0650\u0633\u0652\u0645\u064E\u0627\u0639\u0650\u064A\u0644", phonetic: "Ism\xE2'\xEEl", trans: "Isma\xEBl", desc: "L'anc\xEAtre du Proph\xE8te \uFDFA \u2014 Fils du sacrifice", icon: "\u{1F411}", color: "#ff8c00", story: [
      { title: "Abandonn\xE9 dans le d\xE9sert par amour d'Allah", text: "Ibrahim laissa sa femme Hajar et son nourrisson Isma'il dans la vall\xE9e aride et inhospitali\xE8re de La Mecque \u2014 sur ordre d'Allah. Quand Hajar lui demanda : 'Est-ce Allah qui t'ordonne cela ?' et qu'il r\xE9pondit oui, elle dit avec une foi absolue : 'Alors Il ne nous abandonnera pas.' Ibrahim repartit les larmes aux yeux, priant : 'Seigneur, j'ai \xE9tabli une partie de ma descendance dans une vall\xE9e sans v\xE9g\xE9tation.'" },
      { title: "Le miracle de Zamzam", text: "Hajar courut entre les collines de Safa et Marwa sept fois en cherchant de l'eau pour son b\xE9b\xE9 qui pleurait. C'est l'origine du Sa'y (course) du Hajj et de la Umra. Soudain, sous les talons du petit Isma'il, jaillit la source de Zamzam. Cette eau b\xE9nie attira des tribus qui vinrent s'installer \xE0 La Mecque. Le Proph\xE8te \uFDFA a dit : 'L'eau de Zamzam est pour ce pour quoi on la boit.'" },
      { title: "Le sacrifice qui fonda l'A\xEFd", text: "Quand Isma'il fut grand, Allah ordonna \xE0 Ibrahim en r\xEAve de le sacrifier. Isma'il, inform\xE9, dit : 'P\xE8re, fais ce qu'on t'ordonne. Tu me trouveras parmi les patients.' Au moment du sacrifice, Allah rempla\xE7a Isma'il par un grand b\xE9lier. Cet \xE9v\xE9nement est comm\xE9mor\xE9 chaque ann\xE9e lors de l'A\xEFd Al-Adha par des millions de musulmans." },
      { title: "L'h\xE9ritage proph\xE9tique", text: "Isma'il et Ibrahim construisirent ensemble la Ka'ba. Isma'il ma\xEEtrisait la langue arabe et devint l'anc\xEAtre des tribus arabes du Hijaz. De sa descendance, des si\xE8cles plus tard, naquit Muhammad ibn Abdullah \uFDFA \u2014 le Sceau des Proph\xE8tes." }
    ] },
    { id: 9, name: "Is'haq", arabic: "\u0625\u0650\u0633\u0652\u062D\u064E\u0627\u0642", phonetic: "Is'h\xE2q", trans: "Isaac", desc: "Fils de la promesse divine d'Ibrahim", icon: "\u2B50", color: "#bf5fff", story: [
      { title: "L'annonce miraculeuse", text: "Des anges annonc\xE8rent \xE0 Ibrahim et \xE0 sa femme Sara la naissance d'Is'haq alors que Sara \xE9tait tr\xE8s \xE2g\xE9e et st\xE9rile depuis toujours. Elle s'\xE9tonna : 'Comment enfanterais-je alors que je suis une vieille femme et que mon mari est un vieillard ?' Les anges r\xE9pondirent : 'Est-ce que tu t'\xE9tonnes de l'ordre d'Allah ? Que la mis\xE9ricorde d'Allah et Ses b\xE9n\xE9dictions soient sur vous, gens de la maison !'" },
      { title: "Proph\xE8te et fondateur d'une lign\xE9e", text: "Is'haq fut proph\xE8te et continua la mission de son p\xE8re Ibrahim en Canaan (Palestine actuelle). Il \xE9pousa Rebecca et eut deux fils : Esa\xFC et Ya'qub (Jacob). C'est de la lign\xE9e d'Is'haq que naquit la plupart des grands proph\xE8tes : Ya'qub, Y\xFBsuf, M\xFBsa, Har\xFBn, Dawud, Sulayman, Yahya, Issa \u2014 paix sur eux tous." }
    ] },
    { id: 10, name: "Ya'qub", arabic: "\u064A\u064E\u0639\u0652\u0642\u064F\u0648\u0628", phonetic: "Ya'qoub", trans: "Jacob \u2014 Isra\xEBl", desc: "P\xE8re des douze tribus d'Isra\xEBl", icon: "\u{1F31F}", color: "#00cfff", story: [
      { title: "Isra\xEBl \u2014 le serviteur d'Allah", text: "Ya'qub, fils d'Is'haq et petit-fils d'Ibrahim, re\xE7ut d'Allah le surnom 'Isra\xEBl' qui signifie 'serviteur d'Allah'. Proph\xE8te fid\xE8le, il continua la mission proph\xE9tique en Canaan. Il eut douze fils de plusieurs femmes, qui devinrent les anc\xEAtres des douze tribus d'Isra\xEBl. Son fils le plus aim\xE9 \xE9tait Y\xFBsuf, connu pour sa beaut\xE9 et sa sagesse." },
      { title: "L'\xE9preuve de la s\xE9paration", text: "Quand les fr\xE8res de Y\xFBsuf revinrent pr\xE9tendant que leur fr\xE8re avait \xE9t\xE9 d\xE9vor\xE9 par un loup, Ya'qub refusa de les croire. Il dit avec sagesse : 'Vos \xE2mes vous ont sugg\xE9r\xE9 quelque chose. Mais la patience est belle et c'est d'Allah que j'implore l'aide.' Il pleura tellement la s\xE9paration d'avec Y\xFBsuf qu'il finit par perdre la vue. Mais jamais il ne d\xE9sesp\xE9ra de la mis\xE9ricorde d'Allah." },
      { title: "Les retrouvailles et la gu\xE9rison miraculeuse", text: "Des d\xE9cennies plus tard, Y\xFBsuf, devenu ministre en \xC9gypte, envoya sa chemise \xE0 son p\xE8re : 'Posez-la sur le visage de mon p\xE8re, il recouvrera la vue.' D\xE8s que la chemise fut pos\xE9e sur son visage, Ya'qub retrouva la vue imm\xE9diatement. La famille enti\xE8re se r\xE9unit en \xC9gypte, accomplissant le r\xEAve proph\xE9tique de Y\xFBsuf. Ya'qub dit alors : 'Je savais ce que vous ne saviez pas \u2014 j'esp\xE9rais en la gr\xE2ce d'Allah.'" }
    ] },
    { id: 11, name: "Y\xFBsuf", arabic: "\u064A\u064F\u0648\u0633\u064F\u0641", phonetic: "Youssouf", trans: "Joseph", desc: "Ahsanul Qasas \u2014 Le plus beau des r\xE9cits", icon: "\u{1F451}", color: "#bf5fff", story: [
      { title: "Le r\xEAve proph\xE9tique de l'enfant", text: "Y\xFBsuf raconta \xE0 son p\xE8re un r\xEAve : 'J'ai vu onze \xE9toiles, le soleil et la lune se prosterner devant moi.' Ya'qub comprit que c'\xE9tait un signe proph\xE9tique et le mit en garde : 'Ne le raconte pas \xE0 tes fr\xE8res, sinon par jalousie ils pourraient te tendre un pi\xE8ge. Shaytan est un ennemi d\xE9clar\xE9 de l'homme.' Y\xFBsuf \xE9tait le plus aim\xE9 de Ya'qub pour sa sagesse et sa bont\xE9 \u2014 ce qui attisa la jalousie de ses fr\xE8res." },
      { title: "Le puits, l'esclavage et la prison", text: "Ses fr\xE8res l'emmen\xE8rent en pr\xE9textant une sortie et le jet\xE8rent dans un puits. Des caravaniers le recueillirent et le vendirent comme esclave en \xC9gypte. Dans la maison du ministre \xE9gyptien Al-Aziz, sa femme Zulaykh\xE2 le tenta. Y\xFBsuf refusa avec dignit\xE9 : 'Je cherche refuge en Allah !' Il pr\xE9f\xE9ra la prison plut\xF4t que de c\xE9der au p\xE9ch\xE9. Allah n'abandonne pas Ses serviteurs sinc\xE8res." },
      { title: "L'interpr\xE9tation des r\xEAves \u2014 la sagesse divine", text: "En prison, Y\xFBsuf interpr\xE9ta les r\xEAves de deux cod\xE9tenus avec pr\xE9cision. Puis le roi d'\xC9gypte fit un r\xEAve troublant que nul ne put interpr\xE9ter. L'ancien cod\xE9tenu se souvint de Y\xFBsuf. Il interpr\xE9ta : sept vaches grasses d\xE9vor\xE9es par sept maigres = sept ans d'abondance puis sept ans de terrible famine. Sa sagesse impressionna tellement le roi qu'il le lib\xE9ra et le nomma ministre des finances et des greniers." },
      { title: "Le pardon royal \u2014 une le\xE7on pour l'\xE9ternit\xE9", text: "Durant la famine, ses fr\xE8res vinrent d'Egypte demander des vivres sans le reconna\xEEtre. Apr\xE8s plusieurs \xE9pisodes, Y\xFBsuf se r\xE9v\xE9la \xE0 eux. Ils s'attendaient \xE0 une vengeance terrible. Y\xFBsuf dit alors ces mots immortels : 'Pas de reproche sur vous aujourd'hui. Qu'Allah vous pardonne \u2014 Il est le plus Mis\xE9ricordieux des mis\xE9ricordieux.' La famille enti\xE8re fut r\xE9unie. Le r\xEAve de l'enfant s'\xE9tait accompli : ses parents et ses fr\xE8res se prostern\xE8rent devant lui." }
    ] },
    { id: 12, name: "Ayyub", arabic: "\u0623\u064E\u064A\u064F\u0651\u0648\u0628", phonetic: "Ayyoub", trans: "Job", desc: "Le symbole de la patience absolue en Allah", icon: "\u{1F4AA}", color: "#00cfff", story: [
      { title: "De la richesse \xE0 l'\xE9preuve totale", text: "Ayyub \xE9tait un proph\xE8te qui vivait dans le confort et la richesse, entour\xE9 d'une grande famille et jouissant d'une excellente sant\xE9. Allah l'\xE9prouva graduellement en lui \xF4tant ses biens, puis ses enfants, puis sa sant\xE9. Il fut atteint d'une maladie grave pendant de tr\xE8s longues ann\xE9es. Ses proches l'abandonn\xE8rent un \xE0 un. Seule sa femme fid\xE8le resta \xE0 ses c\xF4t\xE9s pour le servir." },
      { title: "La patience in\xE9branlable", text: "Malgr\xE9 ces \xE9preuves accumul\xE9es qui auraient bris\xE9 n'importe qui, Ayyub ne cessa jamais d'\xEAtre reconnaissant envers Allah et de L'adorer. Il ne prof\xE9ra aucune parole de m\xE9contentement. Le Coran le d\xE9crit ainsi : 'Nous avons trouv\xE9 en lui un homme excellent, souvent repentant.' Sa patience ne venait pas de l'insensibilit\xE9 mais d'une foi profonde en la sagesse d'Allah." },
      { title: "La dou'a de la d\xE9tresse et la gu\xE9rison", text: "Apr\xE8s ses longues souffrances, Ayyub invoqua humblement : 'Seigneur, l'adversit\xE9 m'a touch\xE9 et Tu es le plus Mis\xE9ricordieux des mis\xE9ricordieux.' Allah exau\xE7a imm\xE9diatement sa pri\xE8re. Il lui dit : 'Frappe le sol du pied \u2014 voici une eau fra\xEEche pour te laver et te d\xE9salt\xE9rer.' Allah le gu\xE9rit, lui rendit sa famille et doubla ses biens. Cette dou'a est recommand\xE9e pour toute \xE9preuve ou maladie." }
    ] },
    { id: 13, name: "Shu'ayb", arabic: "\u0634\u064F\u0639\u064E\u064A\u0652\u0628", phonetic: "Chou'ayb", trans: "Jethro", desc: "L'\xE9loquent des proph\xE8tes \u2014 Mission contre la fraude", icon: "\u2696\uFE0F", color: "#ffd700", story: [
      { title: "La fraude end\xE9mique de Madyan", text: "Shu'ayb fut envoy\xE9 au peuple de Madyan, une cit\xE9 commer\xE7ante prosp\xE8re de la p\xE9ninsule arabique. Ces marchands fraudaient syst\xE9matiquement dans les mesures et les poids \u2014 donnant moins que ce qui \xE9tait d\xFB, prenant plus que ce qui \xE9tait convenu. Shu'ayb les appela : '\xD4 mon peuple, adorez Allah, vous n'avez pas d'autre dieu que Lui. Ne fraudez pas dans la mesure et le poids. Je vous vois dans le bien-\xEAtre mais je crains pour vous le ch\xE2timent d'un jour qui vous enveloppera.'" },
      { title: "Le rejet et les menaces", text: "Les notables et les riches r\xE9pondirent avec m\xE9pris : 'Tes pri\xE8res t'ordonnent-elles d'abandonner ce que nos p\xE8res adoraient ou de ne pas faire de nos biens ce que nous voulons ? Tu es vraiment l'indulgent, le raisonnable !' (sur un ton moqueur). Ils mena\xE7aient Shu'ayb et ses croyants de les chasser ou de les forcer \xE0 abandonner leur foi. Shu'ayb r\xE9pondit que seul Allah pouvait les sauver ou les perdre." },
      { title: "Le jour terrible", text: "Le peuple de Madyan nia obstin\xE9ment les avertissements. Un jour, une nu\xE9e sombre s'amassa au-dessus d'eux. Ils crurent que c'\xE9tait la pluie. C'\xE9tait le ch\xE2timent divin. Une terrible secousse les frappa et ils s'effondr\xE8rent morts dans leurs demeures. Shu'ayb dit alors : '\xD4 mon peuple, j'ai bien transmis les messages de mon Seigneur et vous ai prodigu\xE9 de bons conseils. Comment pourrais-je m'affliger d'un peuple m\xE9cr\xE9ant ?'" }
    ] },
    { id: 14, name: "M\xFBsa", arabic: "\u0645\u064F\u0648\u0633\u064E\u0649", phonetic: "Mouss\xE2", trans: "Mo\xEFse", desc: "Kalimullah \u2014 Celui qu'Allah a interpell\xE9 directement", icon: "\u26A1", color: "#ffdd00", story: [
      { title: "La naissance sous la menace", text: "Pharaon faisait tuer tous les nouveau-n\xE9s m\xE2les des Isra\xE9lites par crainte d'une proph\xE9tie. Allah inspira la m\xE8re de M\xFBsa : 'Allaite-le puis quand tu le craindras, jette-le dans le fleuve.' Elle pla\xE7a le nourrisson dans un panier sur le Nil. Le panier fut retrouv\xE9 par la famille de Pharaon. La s\u0153ur de M\xFBsa observa de loin et proposa une nourrice \u2014 ainsi M\xFBsa fut rendu \xE0 sa propre m\xE8re." },
      { title: "Le buisson ardent \u2014 la r\xE9v\xE9lation divine", text: "Devenu adulte et ayant fui l'\xC9gypte apr\xE8s avoir accidentellement tu\xE9 un homme, M\xFBsa se retrouva \xE0 Madyan o\xF9 il travailla dix ans pour un homme pieux (Shu'ayb selon la tradition). Un jour, voyageant avec sa famille, il vit un feu. En s'approchant, une voix l'interpella : '\xD4 M\xFBsa, Moi, Je suis Allah, le Seigneur des Mondes ! Jette ton b\xE2ton !' Le b\xE2ton devint un serpent g\xE9ant. C'\xE9tait le d\xE9but d'une mission immense." },
      { title: "Retour en \xC9gypte \u2014 face \xE0 Pharaon", text: "Allah envoya M\xFBsa et son fr\xE8re Har\xFBn affronter Pharaon avec neuf signes miraculeux : le b\xE2ton-serpent, la main blanche, le d\xE9luge, les sauterelles, les poux, les grenouilles, le sang, etc. Pharaon traitait M\xFBsa de sorcier et refusait de lib\xE9rer les Isra\xE9lites. Malgr\xE9 des ann\xE9es de confrontation, son orgueil l'emp\xEAcha de croire." },
      { title: "La travers\xE9e de la mer \u2014 le miracle ultime", text: "Pharaon finit par lib\xE9rer les Isra\xE9lites apr\xE8s la mort des premiers-n\xE9s. Mais il changea d'avis et les poursuivit avec son arm\xE9e. Accul\xE9s contre la mer Rouge, les Isra\xE9lites d\xE9sesp\xE9r\xE8rent. M\xFBsa dit : 'Non ! Mon Seigneur est avec moi, Il me guidera !' Allah ordonna \xE0 M\xFBsa de frapper la mer de son b\xE2ton \u2014 elle se fendit en douze chemins secs. Pharaon s'engouffra \xE0 leur poursuite et fut englouti. Ses derniers mots furent : 'Je crois qu'il n'y a de dieu que Celui en qui croient les enfants d'Isra\xEBl !'" },
      { title: "La Torah et les 40 nuits", text: "M\xFBsa re\xE7ut la Torah sur le mont Sina\xEF lors d'un rendez-vous de 40 nuits avec Allah. Durant son absence, son peuple fut tromp\xE9 par As-Samir\xEE qui fabriqua un veau d'or. M\xFBsa revint furieux, saisit son fr\xE8re Har\xFBn par la barbe et brisa les tablettes. Il invoqua Allah pour son peuple. Allah lui dit : 'Je ch\xE2tie qui Je veux, mais Ma mis\xE9ricorde englobe toute chose.'" }
    ] },
    { id: 15, name: "Har\xFBn", arabic: "\u0647\u064E\u0627\u0631\u064F\u0648\u0646", phonetic: "H\xE2roun", trans: "Aaron", desc: "Le fr\xE8re et soutien de M\xFBsa", icon: "\u{1F4EF}", color: "#bf5fff", story: [
      { title: "Le don accord\xE9 \xE0 M\xFBsa", text: "Quand Allah confia \xE0 M\xFBsa la mission d'affronter Pharaon, M\xFBsa ressentit sa faiblesse et invoqua : 'Seigneur, donne-moi un aide de ma famille \u2014 mon fr\xE8re Har\xFBn. Renforce gr\xE2ce \xE0 lui ma force, associe-le \xE0 ma mission.' Allah exau\xE7a sa pri\xE8re et fit de Har\xFBn un proph\xE8te \xE0 ses c\xF4t\xE9s. Har\xFBn \xE9tait connu pour son \xE9loquence \u2014 l\xE0 o\xF9 M\xFBsa avait un d\xE9faut d'\xE9locution." },
      { title: "La mission commune", text: "M\xFBsa et Har\xFBn affront\xE8rent ensemble Pharaon et les sorciers. Har\xFBn g\xE9rait le peuple d'Isra\xEBl pendant les absences de M\xFBsa sur le Sina\xEF. Quand M\xFBsa revint et trouva son peuple adorant le veau d'or, Har\xFBn lui expliqua son impuissance : 'Fils de ma m\xE8re, ne me saisis ni par la barbe ni par la t\xEAte. J'ai craint que tu ne dises : tu as divis\xE9 les Isra\xE9lites.'" },
      { title: "Une mort douce sur le mont Hor", text: "Har\xFBn mourut avant d'atteindre la Terre Promise. Selon la tradition, il d\xE9c\xE9da paisiblement sur le mont Hor apr\xE8s que M\xFBsa l'y eut accompagn\xE9. Les Isra\xE9lites, jaloux, accus\xE8rent faussement M\xFBsa de l'avoir tu\xE9. La grandeur d'Har\xFBn \xE9tait son d\xE9vouement total \xE0 la mission de son fr\xE8re et \xE0 la cause d'Allah." }
    ] },
    { id: 16, name: "Dhul-Kifl", arabic: "\u0630\u064F\u0648 \u0627\u0644\u0643\u0650\u0641\u0652\u0644", phonetic: "Dhoul-Kifl", trans: "Celui de la responsabilit\xE9", desc: "Proph\xE8te de la patience et de la promesse", icon: "\u{1F91D}", color: "#00ff88", story: [
      { title: "L'homme de la promesse", text: "Dhul-Kifl est mentionn\xE9 deux fois dans le Coran parmi les proph\xE8tes patients. Son nom signifie 'celui qui prend en charge' ou 'celui de la responsabilit\xE9'. Selon les r\xE9cits, il prit un engagement solennel de prier, je\xFBner et juger avec \xE9quit\xE9 \u2014 et il tint sa promesse toute sa vie." },
      { title: "La patience face aux \xE9preuves", text: "Dhul-Kifl est cit\xE9 par Allah aux c\xF4t\xE9s d'Isma'il et Ayyub comme exemple de patience et de bont\xE9. Il endura les tentations et les provocations sans jamais c\xE9der. Allah dit de lui et de ses compagnons : 'Nous les avons b\xE9nis avec Notre mis\xE9ricorde car ils \xE9taient parmi les vertueux.'" }
    ] },
    { id: 17, name: "Dawud", arabic: "\u062F\u064E\u0627\u0648\u064F\u0648\u062F", phonetic: "D\xE2woud", trans: "David", desc: "Proph\xE8te, roi et psalmodiste d'Allah", icon: "\u{1F5E1}\uFE0F", color: "#ffd700", story: [
      { title: "David contre Goliath", text: "Alors que l'arm\xE9e des Isra\xE9lites tremblait devant le g\xE9ant Jalut (Goliath), le jeune Dawud \u2014 simple berger \u2014 se proposa pour l'affronter. Les soldats le regard\xE8rent avec scepticisme. Avec sa foi en Allah et son courage, il terrassa Jalut d'une seule pierre lanc\xE9e avec sa fronde. Sa victoire miraculeuse changea le cours de l'histoire." },
      { title: "Le roi proph\xE8te", text: "Allah accorda \xE0 Dawud la royaut\xE9, la sagesse et la connaissance. Il lui apprit \xE0 fabriquer des cottes de mailles \u2014 une r\xE9volution militaire. Allah assujettit les montagnes et les oiseaux qui glorifiaient Allah avec Dawud. Le fer s'amollissait entre ses mains par miracle divin pour fabriquer les armures." },
      { title: "Les Psaumes \u2014 le Zabur", text: "Allah r\xE9v\xE9la \xE0 Dawud le Zabur (les Psaumes), un livre saint de glorifications et de pri\xE8res magnifiques. Sa voix \xE9tait d'une beaut\xE9 surnaturelle \u2014 hommes, animaux et montagnes s'arr\xEAtaient pour l'\xE9couter psalmodier les louanges d'Allah. Il pleurait beaucoup par crainte d'Allah et \xE9tait extr\xEAmement aust\xE8re malgr\xE9 sa puissance royale." }
    ] },
    { id: 18, name: "Sulayman", arabic: "\u0633\u064F\u0644\u064E\u064A\u0652\u0645\u064E\u0627\u0646", phonetic: "Soulaym\xE2n", trans: "Salomon", desc: "Le roi des hommes, des djinns et des animaux", icon: "\u{1F48E}", color: "#00cfff", story: [
      { title: "Un royaume sans pareil", text: "Sulayman, fils de Dawud, h\xE9rita de la proph\xE9tie et du royaume. Il pria Allah : 'Seigneur, pardonne-moi et accorde-moi un royaume qui ne conviendra \xE0 personne apr\xE8s moi.' Allah lui accorda un pouvoir unique : la ma\xEEtrise des vents, le langage des animaux et des oiseaux, le commandement des djinns qui construisaient pour lui des palais, des statues, des bassins et des chaudi\xE8res immenses." },
      { title: "La huppe et la reine de Saba", text: "Un jour, la huppe manquait \xE0 l'appel. Elle revint avec une nouvelle \xE9tonnante : 'J'ai vu une reine, Bilq\xEEs, qui r\xE8gne sur Saba avec un tr\xF4ne magnifique, mais elle et son peuple adorent le soleil.' Sulayman lui envoya une lettre commen\xE7ant par Bismillah et l'invitant \xE0 l'Islam. La reine, impressionn\xE9e, vint le voir. Elle embrassa l'Islam apr\xE8s avoir vu son tr\xF4ne transport\xE9 en un clin d'\u0153il." },
      { title: "La mort et les djinns", text: "Quand Sulayman mourut appuy\xE9 sur son b\xE2ton, les djinns continu\xE8rent \xE0 travailler des mois sans savoir qu'il \xE9tait mort. Ce n'est que lorsqu'un ver rongea son b\xE2ton et qu'il tomba que les djinns comprirent. Ainsi Allah montra que les djinns ne connaissent pas le monde invisible." }
    ] },
    { id: 19, name: "Ilyas", arabic: "\u0625\u0650\u0644\u0652\u064A\u064E\u0627\u0633", phonetic: "Ily\xE2s", trans: "\xC9lie", desc: "Proph\xE8te envoy\xE9 contre l'idol\xE2trie de Ba'l", icon: "\u26A1", color: "#ff8c00", story: [
      { title: "La lutte contre l'idole Ba'l", text: "Ilyas fut envoy\xE9 \xE0 un peuple qui adorait une idole appel\xE9e Ba'l tout en pr\xE9tendant croire en Allah. Il les appela \xE0 abandonner Ba'l et \xE0 revenir \xE0 l'adoration d'Allah Seul. Il leur dit : 'Adorez-vous Ba'l et abandonnez-vous le meilleur des cr\xE9ateurs \u2014 Allah, votre Seigneur et le Seigneur de vos p\xE8res les plus anciens ?'" },
      { title: "Le rejet et la fuite", text: "Son peuple le rejeta avec v\xE9h\xE9mence. Ilyas fut contraint de fuir. Allah l'\xE9leva et le pr\xE9serva. Le Coran dit de lui : 'Il est certes parmi Nos serviteurs croyants.' Sa m\xE9moire fut pr\xE9serv\xE9e pour les g\xE9n\xE9rations futures : 'Paix sur Ilyas !' \u2014 une salutation qu'Allah Lui-m\xEAme lui adresse dans le Coran." }
    ] },
    { id: 20, name: "Al-Yasa'", arabic: "\u0627\u0644\u064A\u064E\u0633\u064E\u0639", phonetic: "Al-Yasa'", trans: "\xC9lis\xE9e", desc: "Successeur du proph\xE8te Ilyas", icon: "\u{1F30A}", color: "#00ff88", story: [
      { title: "Le successeur fid\xE8le", text: "Al-Yasa' fut le successeur et le disciple du proph\xE8te Ilyas. Il continua sa mission aupr\xE8s des Isra\xE9lites, les appelant \xE0 la foi pure en Allah. Le Coran le place parmi les meilleurs proph\xE8tes : 'Al-Yasa', Dhul-Kifl \u2014 tous font partie des vertueux.'" },
      { title: "Un proph\xE8te parmi les meilleurs", text: "Allah le cita dans le Coran en lui accordant une mention d'honneur parmi Ses proph\xE8tes \xE9lus. Bien que les d\xE9tails de sa vie soient peu mentionn\xE9s dans les textes islamiques, sa place parmi les proph\xE8tes de la lign\xE9e d'Ibrahim est incontestable." }
    ] },
    { id: 21, name: "Yunus", arabic: "\u064A\u064F\u0648\u0646\u064F\u0633", phonetic: "Younous", trans: "Jonas", desc: "Dhul-Nun \u2014 L'homme de la baleine", icon: "\u{1F40B}", color: "#ff6b9d", story: [
      { title: "Le d\xE9part pr\xE9cipit\xE9", text: "Yunus fut envoy\xE9 \xE0 Ninive (actuelle Mossoul en Irak), une ville de plus de 100 000 habitants. Apr\xE8s des ann\xE9es de pr\xE9dication infructueuse, il se d\xE9couragea et quitta sa mission sans autorisation divine. Il monta sur un bateau. Une temp\xEAte terrible secoua le navire \u2014 les marins tir\xE8rent au sort pour jeter quelqu'un \xE0 la mer. Le sort tomba sur Yunus." },
      { title: "Dans le ventre de la baleine", text: "Une baleine l'avala. Dans les t\xE9n\xE8bres triples (ventre de la baleine, fond de la mer, nuit), Yunus invoqua avec une foi sinc\xE8re : 'Il n'y a de dieu que Toi ! Gloire \xE0 Toi ! J'ai \xE9t\xE9 du nombre des injustes !' \u2014 C'est la Dou'a de Yunus, l'une des plus puissantes invocations de l'Islam. Allah exau\xE7a imm\xE9diatement et la baleine le rejeta sur un rivage." },
      { title: "Le retour et le succ\xE8s", text: "Allah fit pousser miraculeusement une plante (une courge) sur lui pour le couvrir et le nourrir dans sa faiblesse. Gu\xE9ri, Yunus retourna \xE0 sa mission. Cette fois, tout le peuple de Ninive crut \xE0 son appel \u2014 100 000 personnes ou plus, selon le Coran. Ce fut l'une des plus grandes conversions collectives de l'histoire des proph\xE8tes." }
    ] },
    { id: 22, name: "Zakariyya", arabic: "\u0632\u064E\u0643\u064E\u0631\u0650\u064A\u064E\u0651\u0627", phonetic: "Zakariyy\xE2", trans: "Zacharie", desc: "Le gardien de Maryam et p\xE8re de Yahya", icon: "\u{1F33A}", color: "#bf5fff", story: [
      { title: "Le gardien de Maryam", text: "Zakariyya \xE9tait le grand pr\xEAtre du Temple de J\xE9rusalem et l'oncle de Maryam (Marie). Il fut d\xE9sign\xE9 comme tuteur de la jeune Maryam. Chaque fois qu'il entrait dans sa chambre de retraite au temple, il trouvait une nourriture miraculeuse. Il lui demanda : 'D'o\xF9 te vient ceci ?' Elle r\xE9pondit : 'Cela vient d'Allah. Allah accorde Ses dons \xE0 qui Il veut sans compter.'" },
      { title: "La pri\xE8re du vieillard d\xE9sesp\xE9r\xE9", text: "Touch\xE9 par ce miracle, Zakariyya invoqua Allah : 'Seigneur, accorde-moi de Ta part une bonne descendance. Tu entends les pri\xE8res.' Or Zakariyya \xE9tait tr\xE8s vieux et sa femme st\xE9rile depuis toujours. Les anges lui annonc\xE8rent : 'Allah t'annonce Yahya, qui confirmera une parole d'Allah, sera un ma\xEEtre, un chaste et un proph\xE8te parmi les vertueux.'" },
      { title: "Le signe du silence", text: "Zakariyya demanda un signe. Allah lui dit : 'Ton signe est de ne pas parler aux gens pendant trois jours.' Durant ces trois jours, Zakariyya ne pouvait s'exprimer que par gestes. Il passait ses journ\xE9es \xE0 faire la glorification d'Allah dans le silence. Puis Yahya naquit, accomplissant la promesse divine." }
    ] },
    { id: 23, name: "Yahya", arabic: "\u064A\u064E\u062D\u0652\u064A\u064E\u0649", phonetic: "Yahy\xE2", trans: "Jean-Baptiste", desc: "Confirmateur du Messie \u2014 Proph\xE8te de la puret\xE9", icon: "\u{1F54A}\uFE0F", color: "#00cfff", story: [
      { title: "Un enfant unique", text: "Yahya fut un enfant miraculeux \u2014 n\xE9 d'un p\xE8re tr\xE8s vieux et d'une m\xE8re st\xE9rile par la gr\xE2ce d'Allah. Il re\xE7ut son nom directement d'Allah : 'Yahya' \u2014 un nom qu'aucun homme n'avait port\xE9 avant lui. D\xE8s son enfance, Allah dit de lui : '\xD4 Yahya, prends le Livre avec force !' Enfant, il refusait de jouer avec ses camarades et pr\xE9f\xE9rait la m\xE9ditation et l'adoration." },
      { title: "Le proph\xE8te de la Tawra et de la nature", text: "Yahya vivait dans la nature, s'habillait de poils de chameau et se nourrissait de sauterelles et de miel sauvage. Il \xE9tait d'une puret\xE9 et d'une asc\xE8se absolues. Il confirmait l'arriv\xE9e prochaine du Messie Issa. Il appelait les gens \xE0 se repentir et se purifier. Le Coran le d\xE9crit : 'plein de bont\xE9 et de pi\xE9t\xE9, et pieux envers ses parents \u2014 il ne fut jamais orgueilleux ni rebelle.'" },
      { title: "Un martyr de la v\xE9rit\xE9", text: "Yahya fut assassin\xE9 par le roi H\xE9rode Antipas qui le fit d\xE9capiter pour avoir condamn\xE9 son mariage illicite avec la femme de son fr\xE8re. Il mourut martyr de la v\xE9rit\xE9 sans jamais avoir c\xE9d\xE9. Allah lui accorda la paix le jour de sa naissance, le jour de sa mort et le jour o\xF9 il sera ressuscit\xE9." }
    ] },
    { id: 24, name: "Issa", arabic: "\u0639\u0650\u064A\u0633\u064E\u0649", phonetic: "'Iss\xE2", trans: "J\xE9sus", desc: "Ruhullah \u2014 L'Esprit d'Allah et son Verbe", icon: "\u2728", color: "#ffd700", story: [
      { title: "La naissance miraculeuse de Maryam", text: "Maryam \xE9tait une femme pure et vierge, consacr\xE9e au service du Temple. L'ange Jibr\xEEl lui apparut sous forme humaine. Elle eut peur. L'ange dit : 'Je suis l'envoy\xE9 de ton Seigneur pour te donner un fils pur.' Elle demanda : 'Comment aurais-je un fils, alors qu'aucun homme ne m'a touch\xE9e ?' Il r\xE9pondit : 'Ainsi dit Allah : c'est chose facile pour Moi.' Issa naquit sans p\xE8re \u2014 un miracle unique dans l'histoire." },
      { title: "Les miracles de l'Envoy\xE9", text: "Allah accorda \xE0 Issa des miracles extraordinaires : il parla dans son berceau pour d\xE9fendre l'honneur de sa m\xE8re. Il fa\xE7onnait des oiseaux d'argile et soufflait dedans \u2014 ils s'envolaient vivants. Il gu\xE9rissait les aveugles-n\xE9s et les l\xE9preux. Il ressuscitait des morts par permission d'Allah. Il savait ce que les gens avaient mang\xE9 et stock\xE9 chez eux. Ces miracles t\xE9moignaient de sa mission proph\xE9tique." },
      { title: "La table c\xE9leste", text: "Les disciples de Issa lui demand\xE8rent : 'Ton Seigneur peut-Il faire descendre une table servie du ciel ?' Issa pria Allah. Une table garnie de nourriture descendit du ciel \u2014 un signe et une f\xEAte pour eux. Allah avertit ceux qui m\xE9croiraient apr\xE8s ce signe d'un ch\xE2timent unique dans l'histoire." },
      { title: "L'\xE9l\xE9vation et le retour annonc\xE9", text: "Les ennemis de Issa complot\xE8rent pour le tuer. Mais Allah dit : 'Ils ne l'ont ni tu\xE9 ni crucifi\xE9 \u2014 ils n'en ont eu que l'illusion.' Allah l'\xE9leva vivant vers Lui. Le Proph\xE8te Muhammad \uFDFA annon\xE7a que Issa reviendra \xE0 la fin des temps, brisera la croix, tuera le Dajjal, \xE9tablira la justice sur Terre et mourra naturellement." }
    ] },
    { id: 25, name: "Muhammad \uFDFA", arabic: "\u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064C \uFDFA", phonetic: "Muhammad", trans: "Le Lou\xE9", desc: "Khatam An-Nabiyyin \u2014 Le Sceau des Proph\xE8tes", icon: "\u{1F319}", color: "#ffd700", story: [
      { title: "L'orphelin de La Mecque", text: "Muhammad \uFDFA naquit \xE0 La Mecque vers 570 EC, l'Ann\xE9e de l'\xC9l\xE9phant. Son p\xE8re Abdullah mourut avant sa naissance. Sa m\xE8re \xC2mina mourut quand il avait 6 ans. Orphelin, il fut \xE9lev\xE9 d'abord par son grand-p\xE8re Abdul Muttalib puis par son oncle Abu Talib. D\xE8s son enfance, il \xE9tait connu par tous pour son honn\xEAtet\xE9 et son int\xE9grit\xE9 \u2014 les Mecquois l'appelaient Al-Amin, 'le Digne de confiance'." },
      { title: "La premi\xE8re r\xE9v\xE9lation \u2014 Iqra'", text: "\xC0 40 ans, lors d'une retraite spirituelle dans la grotte de Hira, l'ange Jibr\xEEl lui apparut et le pressa trois fois : 'Iqra' ! \u2014 Lis !' Muhammad \uFDFA r\xE9pondit qu'il ne savait pas lire. Jibr\xEEl lui r\xE9v\xE9la les premiers versets du Coran : 'Lis au nom de ton Seigneur qui a cr\xE9\xE9 \u2014 Il a cr\xE9\xE9 l'homme d'une adh\xE9rence.' Muhammad \uFDFA rentra tremblant chez Khadija. Elle le r\xE9conforta et il re\xE7ut les r\xE9v\xE9lations pendant 23 ans." },
      { title: "13 ans de pers\xE9cution \xE0 La Mecque", text: "Pendant 13 ans, le Proph\xE8te \uFDFA et ses Compagnons endur\xE8rent des pers\xE9cutions terribles \xE0 La Mecque : torture, boycott \xE9conomique, insultes, tentatives d'assassinat. Il perdit ses proches les plus chers : Khadija, son oncle Abu Talib. Il fut lapid\xE9 \xE0 Ta\xEFf jusqu'au sang. Jamais il ne r\xE9pondit par la violence, faisant preuve d'une patience et d'un pardon extraordinaires." },
      { title: "L'H\xE9gire \u2014 le tournant de l'Islam", text: "En 622 EC, le Proph\xE8te \uFDFA \xE9migra de La Mecque \xE0 M\xE9dine \u2014 c'est la Hijra qui marque le d\xE9but du calendrier islamique. \xC0 M\xE9dine, il construisit la premi\xE8re mosqu\xE9e, \xE9tablit la fraternit\xE9 entre Emigrants et M\xE9dinois, r\xE9digea la Constitution de M\xE9dine et posa les fondements de la premi\xE8re communaut\xE9 islamique organis\xE9e." },
      { title: "La conqu\xEAte de La Mecque \u2014 le pardon universel", text: "En 630 EC, apr\xE8s 8 ans, Muhammad \uFDFA revint \xE0 La Mecque \xE0 la t\xEAte de 10 000 Compagnons. La ville se rendit sans combat. Devant ses anciens pers\xE9cuteurs, il dit ces mots m\xE9morables : 'Que vous dit-on que je vais faire de vous ?' Ils r\xE9pondirent : 'Du bien \u2014 tu es un fr\xE8re g\xE9n\xE9reux.' Il dit : 'Allez \u2014 vous \xEAtes libres !' Ce pardon total reste l'un des plus grands actes de l'histoire humaine." },
      { title: "Le Dernier Sermon et l'ach\xE8vement de la mission", text: "Lors du p\xE8lerinage d'adieu en 632 EC, le Proph\xE8te \uFDFA pronon\xE7a son c\xE9l\xE8bre discours devant 114 000 Compagnons. Il dit : 'Votre sang, vos biens et votre honneur sont sacr\xE9s. Vous compara\xEEtrez devant votre Seigneur. J'ai transmis le message \u2014 t\xE9moignez !' Quelques mois plus tard, il mourut \xE0 M\xE9dine \xE0 63 ans. Quelques mois plus tard, il mourut \xE0 M\xE9dine \xE0 63 ans. Les derni\xE8res paroles sur ses l\xE8vres \xE9taient : O peuple, aucun proph\xE8te ou ap\xF4tre ne viendra apr\xE8s moi, et aucune nouvelle foi ne na\xEEtra. Raisonnez donc bien, o peuple, et comprenez mes paroles que je vous transmets. Je laisse derri\xE8re moi deux choses, le Coran et ma Sunna et si vous les suivez, vous ne vous \xE9garez jamais." }
    ] }
  ];
  var PROPHETS_EN = [
    { id: 1, desc: "The first man and first prophet", story: [
      { title: "The Creation of Adam", text: "Allah created Adam from clay, gave him the finest form and breathed His spirit into him. The angels, by Allah's command, all prostrated before him as a sign of honour. Iblis (Shaytan) refused arrogantly: 'I am better than him \u2014 You created me from fire and him from clay.' This disobedience caused him to be expelled from Paradise forever." },
      { title: "The Teaching of Names", text: "Allah taught Adam the names of all things \u2014 knowledge that the angels did not possess. When Allah asked them to name these things, they admitted their ignorance. Adam named them all, proving his superiority through the knowledge Allah had granted him." },
      { title: "The Garden and the Trial", text: "Allah placed Adam and his wife Hawwa in the Garden, granting them everything freely except one forbidden tree. Shaytan deceived them by whispering false promises of immortality. They yielded, tasted the forbidden fruit, then sincerely repented. Allah forgave them but sent them down to Earth to live their lives." },
      { title: "The First Prophet on Earth", text: "Adam became the first prophet on Earth. He taught his children faith in Allah alone, good and evil, and religious rites. He transmitted divine guidance to humanity. His son Qabil killed his brother Habil out of jealousy \u2014 the first murder in history. Adam lived, according to tradition, more than 900 years and died having passed on the faith to his descendants." }
    ] },
    { id: 2, desc: "The prophet raised to a sublime station", story: [
      { title: "A Man Elevated by Allah", text: "Idris is mentioned twice in the Quran as a truthful and patient prophet. Allah says of him: 'We raised him to a high station.' According to Islamic tradition, he was raised to heaven while still alive \u2014 a unique grace that Allah granted him in reward for his exceptional piety." },
      { title: "The Pioneer Scholar", text: "According to scholars' accounts, Idris was one of the first humans to write with a pen and to read texts. He mastered astronomy, the science of stars, tailoring and arithmetic. He called his people to worship Allah alone, to abandon injustice and stay away from vices. His patience in the face of rejection was exemplary." },
      { title: "His Place Among the Prophets", text: "The Prophet Muhammad \uFDFA met him during the Night Journey (Isra' wal Mi'raj) at the fourth heaven. Idris is venerated as one of the great prophets of Adam's lineage, before the Flood of Nuh. His life illustrates that piety and knowledge are not opposites but complement each other in Islam." }
    ] },
    { id: 3, desc: "The prophet of the Ark \u2014 950 years of mission", story: [
      { title: "950 Years of Relentless Da'wa", text: "Nuh preached to his people for 950 years without ever losing heart. He called them day and night, in public and in private, with gentleness and with firmness. Yet only a handful of believers answered his call. The chiefs of his people said: 'He is nothing but an arrogant liar. Those who follow him are the most wretched among us!'" },
      { title: "The Building of the Ark", text: "By Allah's command, Nuh built a gigantic ark in the middle of a desert, far from any sea. The disbelievers mocked him openly: 'A carpenter turned prophet!' Nuh answered calmly and continued working. When the ark was finished, Allah commanded him to embark the believers and a pair of every animal species." },
      { title: "The Great Flood", text: "The flood struck with unimaginable violence \u2014 waters gushed from the earth and fell from the sky. Nuh's son refused to board, saying he would take refuge on a mountain. Nuh cried out: 'Today nothing protects against Allah's decree!' His son perished. The ark sailed on waves like mountains. Then Allah commanded the earth to absorb the waters and the ark came to rest on Mount Judi." },
      { title: "A New Humanity", text: "After the flood, Nuh and the believers descended from the ark onto a purified Earth. Allah told him: 'Descend with peace from Us.' Nuh is considered the second father of humanity, as all of humanity's current descendants come from him and his sons." }
    ] },
    { id: 4, desc: "Prophet of the mighty people of 'Ad", story: [
      { title: "The People of 'Ad \u2014 Pride and Power", text: "The people of 'Ad lived in the region of Ahqaf (present-day Emirates/Yemen). They were a nation of extraordinary physical strength. They built immense palaces and pillars in the mountains. Their arrogance led them to say: 'Who is mightier than us?' They worshipped idols and had turned away from the faith of their ancestors." },
      { title: "Hud's Courageous Call", text: "Hud was one of them \u2014 a respected man among the people of 'Ad. He called them to worship Allah alone, to abandon idols, to show humility and gratitude. He reminded them of Allah's blessings: rain, wealth, children. The chiefs called him a 'madman' and a 'liar'. They said: 'Our gods have afflicted you with madness!'" },
      { title: "The Wind of Destruction", text: "Hud announced the divine punishment. A dark cloud appeared on the horizon \u2014 they naively thought it was the long-awaited rain. It was in reality a furious icy wind that would destroy them. The wind blew for seven nights and eight consecutive days, reducing the people of 'Ad to nothing like hollow palm trunks. Only Hud and the believers were spared." }
    ] },
    { id: 5, desc: "Allah's she-camel and the people of Thamud", story: [
      { title: "The People of Thamud and Their Rocks", text: "The people of Thamud lived in Al-Hijr (present-day Madain Salih region in Saudi Arabia) and were distinguished by their art of carving rocks to make dwellings and palaces. Rich and powerful, they had however fallen into idolatry and injustice." },
      { title: "Allah's Miraculous She-Camel", text: "The people of Thamud asked Salih for a miraculous sign to believe. Allah brought forth an extraordinary she-camel from the rock \u2014 an undeniable miracle. Allah commanded them: 'Do not harm her, let her graze freely, otherwise a painful punishment will reach you.' Salih told them: 'Here is Allah's she-camel \u2014 it is a sign for you.'" },
      { title: "The Unforgivable Crime", text: "The most arrogant of the people, driven by their chief Qudaar ibn Salif, killed the she-camel in cold blood. This was their death sentence. Salih announced to them: 'Enjoy yourselves in your homes for three more days, then the punishment will reach you.' The three days passed in carelessness. On the fourth day, a terrible cry split the sky and lightning struck them all \u2014 Thamud was completely annihilated." }
    ] },
    { id: 6, desc: "Khalilullah \u2014 The Close Friend of Allah", story: [
      { title: "Awakening to the Truth", text: "Ibrahim grew up in a family of idol worshippers \u2014 his father Azar made and sold idols. From a young age, his sharp mind questioned these beliefs. He observed the stars, the moon, the sun and reasoned: these celestial bodies set \u2014 they cannot be gods. He concluded: 'I turn my face toward the One who created the heavens and the Earth.'" },
      { title: "The Destruction of the Idols", text: "Ibrahim smashed all the idols in his people's temple except the largest on which he placed his axe. When the people accused him, he said: 'Ask the big idol since it can speak!' The people looked at each other and said: 'It was Ibrahim who did it.' Ibrahim said to them: 'Do you worship what you have carved with your own hands when Allah created you?'" },
      { title: "In the Fire \u2014 Divine Miracle", text: "King Nimrod ordered Ibrahim to be thrown alive into a massive pyre lit for days. He was launched into it with a catapult. Allah said to the fire: 'Be cool and safe for Ibrahim!' Ibrahim came out unharmed, without even the smell of burning. This miracle shook some hearts but Nimrod persisted in his obstinacy." },
      { title: "The Supreme Sacrifice", text: "Allah tested Ibrahim with one of the hardest trials: commanding him in a dream to sacrifice his son Isma'il. Ibrahim informed his son. Isma'il responded with remarkable faith: 'Father, do what you are commanded. You will find me among the patient.' At the moment of sacrifice, Allah replaced Isma'il with a ram and said: 'Ibrahim, you have confirmed the dream. Thus We reward the virtuous.' This trial is commemorated every year during Eid Al-Adha." },
      { title: "The Ka'ba and the Eternal Blessing", text: "Ibrahim and his son Isma'il built the Ka'ba together in Mecca, raising its foundations and praying: 'Lord, accept this from us, You hear all and know all. Send among them a Messenger from their midst.' This prayer was answered 2600 years later with the birth of the Prophet Muhammad \uFDFA." }
    ] },
    { id: 7, desc: "Ibrahim's nephew \u2014 Mission in corrupt cities", story: [
      { title: "Lut's Mission in Sodom", text: "Lut, Ibrahim's nephew, was sent to the cities of Sodom and its surroundings, in present-day Jordan. These populations had sunk into vices that no people before them had practiced \u2014 particularly homosexuality. Lut called them to Allah, warned them of divine punishment and asked them to abandon their practices. He was rejected and mocked." },
      { title: "The Angel Visitors", text: "One day, angels in the form of very handsome young men came to Lut's home as guests. The news spread through the city and the inhabitants came in large numbers with evil intentions. Lut was anxious for his guests. The angels told him: 'Fear not, we are Allah's messengers. Leave this night with your family. Do not look back and do not stop.'" },
      { title: "The Destruction of the Cities", text: "At dawn, Allah turned the guilty cities upside down and rained upon them baked clay stones in a dense shower. The entire population was annihilated. Lut and his daughters were saved. His wife, who sympathised with the perverts and betrayed Lut by informing them of his guests, perished with the others. This story is an eternal warning in the Quran against vices and injustice." }
    ] },
    { id: 8, desc: "Ancestor of the Prophet \uFDFA \u2014 Son of sacrifice", story: [
      { title: "Abandoned in the Desert for the Love of Allah", text: "Ibrahim left his wife Hajar and his infant Isma'il in the arid and inhospitable valley of Mecca \u2014 by Allah's command. When Hajar asked him: 'Is it Allah who commands you this?' and he answered yes, she said with absolute faith: 'Then He will not abandon us.' Ibrahim left with tears in his eyes, praying: 'Lord, I have settled part of my descendants in a valley without vegetation.'" },
      { title: "The Miracle of Zamzam", text: "Hajar ran seven times between the hills of Safa and Marwa searching for water for her crying baby. This is the origin of the Sa'y (running) of Hajj and Umra. Suddenly, beneath the feet of little Isma'il, the spring of Zamzam gushed forth. This blessed water attracted tribes who came to settle in Mecca. The Prophet \uFDFA said: 'Zamzam water is for whatever purpose one drinks it.'" },
      { title: "The Sacrifice That Founded Eid", text: "When Isma'il had grown, Allah commanded Ibrahim in a dream to sacrifice him. Isma'il, informed, said: 'Father, do what you are commanded. You will find me among the patient.' At the moment of sacrifice, Allah replaced Isma'il with a great ram. This event is commemorated every year during Eid Al-Adha by millions of Muslims." },
      { title: "The Prophetic Legacy", text: "Isma'il and Ibrahim built the Ka'ba together. Isma'il mastered the Arabic language and became the ancestor of the Arab tribes of the Hijaz. From his descendants, centuries later, was born Muhammad ibn Abdullah \uFDFA \u2014 the Seal of the Prophets." }
    ] },
    { id: 9, desc: "Son of Ibrahim's divine promise", story: [
      { title: "The Miraculous Announcement", text: "Angels announced to Ibrahim and his wife Sara the birth of Is'haq when Sara was very old and had always been barren. She marvelled: 'How shall I bear a child, seeing I am an old woman and this my husband is an old man?' The angels replied: 'Do you wonder at Allah's command? Allah's mercy and His blessings be upon you, people of the house!'" },
      { title: "Prophet and Founder of a Lineage", text: "Is'haq was a prophet and continued his father Ibrahim's mission in Canaan (present-day Palestine). He married Rebecca and had two sons: Esau and Ya'qub (Jacob). It is from Is'haq's lineage that most of the great prophets came: Ya'qub, Yusuf, Musa, Harun, Dawud, Sulayman, Yahya, Issa \u2014 peace be upon them all." }
    ] },
    { id: 10, desc: "Father of the twelve tribes of Israel", story: [
      { title: "Israel \u2014 The Servant of Allah", text: "Ya'qub, son of Is'haq and grandson of Ibrahim, received from Allah the name 'Israel' which means 'servant of Allah'. A faithful prophet, he continued the prophetic mission in Canaan. He had twelve sons from several wives, who became the ancestors of the twelve tribes of Israel. His most beloved son was Yusuf, known for his beauty and wisdom." },
      { title: "The Trial of Separation", text: "When Yusuf's brothers returned claiming their brother had been devoured by a wolf, Ya'qub refused to believe them. He said wisely: 'Your souls have suggested something to you. But patience is beautiful and it is from Allah that I seek help.' He wept so much over the separation from Yusuf that he eventually lost his sight. But he never despaired of Allah's mercy." },
      { title: "The Reunion and the Miraculous Healing", text: "Decades later, Yusuf, who had become a minister in Egypt, sent his shirt to his father: 'Place it on my father's face, he will recover his sight.' As soon as the shirt was placed on his face, Ya'qub immediately recovered his sight. The whole family reunited in Egypt, fulfilling Yusuf's prophetic dream. Ya'qub said: 'I knew what you did not know \u2014 I was hoping in Allah's grace.'" }
    ] },
    { id: 11, desc: "Ahsanul Qasas \u2014 The most beautiful of stories", story: [
      { title: "The Child's Prophetic Dream", text: "Yusuf told his father a dream: 'I saw eleven stars, the sun and the moon prostrating before me.' Ya'qub understood it was a prophetic sign and warned him: 'Do not tell your brothers, for they might in jealousy set a trap for you. Shaytan is a declared enemy of man.' Yusuf was the most beloved by Ya'qub for his wisdom and kindness \u2014 which fuelled his brothers' jealousy." },
      { title: "The Well, Slavery and Prison", text: "His brothers took him away on the pretext of an outing and threw him into a well. Caravan traders found him and sold him as a slave in Egypt. In the home of the Egyptian minister Al-Aziz, his wife Zulaykha tempted him. Yusuf refused with dignity: 'I seek refuge in Allah!' He preferred prison rather than yield to sin. Allah does not abandon His sincere servants." },
      { title: "Dream Interpretation \u2014 Divine Wisdom", text: "In prison, Yusuf accurately interpreted the dreams of two fellow prisoners. Then the king of Egypt had a troubling dream that no one could interpret. The former prisoner remembered Yusuf. He interpreted: seven fat cows devoured by seven lean ones = seven years of abundance then seven years of terrible famine. His wisdom so impressed the king that he freed him and appointed him minister of finance and granaries." },
      { title: "The Royal Forgiveness \u2014 A Lesson for Eternity", text: "During the famine, his brothers came from Egypt asking for provisions without recognising him. After several episodes, Yusuf revealed himself to them. They expected terrible revenge. Yusuf then said these immortal words: 'No blame on you today. May Allah forgive you \u2014 He is the Most Merciful of the merciful.' The whole family was reunited. The child's dream had been fulfilled: his parents and brothers prostrated before him." }
    ] },
    { id: 12, desc: "The symbol of absolute patience in Allah", story: [
      { title: "From Wealth to Total Trial", text: "Ayyub was a prophet who lived in comfort and wealth, surrounded by a large family and enjoying excellent health. Allah tested him gradually by taking away his wealth, then his children, then his health. He was afflicted with a severe illness for very long years. His relatives abandoned him one by one. Only his faithful wife remained by his side to serve him." },
      { title: "Unshakeable Patience", text: "Despite these accumulated trials that would have broken anyone, Ayyub never ceased to be grateful to Allah and worship Him. He uttered no word of discontent. The Quran describes him thus: 'We found him an excellent man, often turning to Us.' His patience came not from insensitivity but from a deep faith in Allah's wisdom." },
      { title: "The Du'a of Distress and the Healing", text: "After his long sufferings, Ayyub humbly invoked: 'Lord, adversity has touched me and You are the Most Merciful of the merciful.' Allah immediately answered his prayer. He told him: 'Strike the ground with your foot \u2014 here is cool water to wash with and to drink.' Allah healed him, returned his family and doubled his wealth. This du'a is recommended for every trial or illness." }
    ] },
    { id: 13, desc: "The eloquent of prophets \u2014 Mission against fraud", story: [
      { title: "The Endemic Fraud of Madyan", text: "Shu'ayb was sent to the people of Madyan, a prosperous trading city of the Arabian Peninsula. These merchants systematically cheated in measures and weights \u2014 giving less than was due, taking more than was agreed. Shu'ayb called them: 'O my people, worship Allah, you have no other god but Him. Do not cheat in measure and weight. I see you in prosperity but I fear for you the punishment of an all-encompassing day.'" },
      { title: "The Rejection and Threats", text: "The notables and the rich responded with contempt: 'Do your prayers command you to abandon what our fathers worshipped or not to do with our wealth what we wish? You are truly the forbearing, the wise!' (in a mocking tone). They threatened Shu'ayb and his believers with expelling them or forcing them to abandon their faith. Shu'ayb replied that only Allah could save or destroy them." },
      { title: "The Terrible Day", text: "The people of Madyan stubbornly denied the warnings. One day, a dark cloud gathered above them. They thought it was rain. It was divine punishment. A terrible trembling struck them and they collapsed dead in their homes. Shu'ayb then said: 'O my people, I have conveyed my Lord's messages to you and given you good advice. How could I grieve for a disbelieving people?'" }
    ] },
    { id: 14, desc: "Kalimullah \u2014 The one whom Allah addressed directly", story: [
      { title: "Birth Under Threat", text: "Pharaoh was killing all male newborns of the Israelites for fear of a prophecy. Allah inspired Musa's mother: 'Nurse him then when you fear for him, cast him into the river.' She placed the infant in a basket on the Nile. The basket was found by Pharaoh's family. Musa's sister observed from a distance and suggested a wet nurse \u2014 thus Musa was returned to his own mother." },
      { title: "The Burning Bush \u2014 Divine Revelation", text: "Having grown up and fled Egypt after accidentally killing a man, Musa found himself in Madyan where he worked ten years for a pious man (Shu'ayb according to tradition). One day, travelling with his family, he saw a fire. Approaching it, a voice addressed him: 'O Musa, I am Allah, the Lord of all Worlds! Throw your staff!' The staff became a giant serpent. This was the beginning of an immense mission." },
      { title: "Return to Egypt \u2014 Facing Pharaoh", text: "Allah sent Musa and his brother Harun to confront Pharaoh with nine miraculous signs: the staff-serpent, the white hand, the flood, the locusts, the lice, the frogs, the blood, etc. Pharaoh treated Musa as a sorcerer and refused to free the Israelites. Despite years of confrontation, his arrogance prevented him from believing." },
      { title: "The Parting of the Sea \u2014 The Ultimate Miracle", text: "Pharaoh eventually freed the Israelites after the death of the firstborns. But he changed his mind and pursued them with his army. Backed against the Red Sea, the Israelites despaired. Musa said: 'No! My Lord is with me, He will guide me!' Allah commanded Musa to strike the sea with his staff \u2014 it split into twelve dry paths. Pharaoh rushed in pursuit and was engulfed. His last words were: 'I believe that there is no god but the One in whom the children of Israel believe!'" },
      { title: "The Torah and the 40 Nights", text: "Musa received the Torah on Mount Sinai during a 40-night appointment with Allah. During his absence, his people were deceived by As-Samiri who made a golden calf. Musa returned furious, seized his brother Harun by the beard and smashed the tablets. He invoked Allah for his people. Allah told him: 'I punish whom I will, but My mercy encompasses all things.'" }
    ] },
    { id: 15, desc: "The brother and support of Musa", story: [
      { title: "The Gift Given to Musa", text: "When Allah entrusted Musa with the mission of confronting Pharaoh, Musa felt his weakness and invoked: 'Lord, give me a helper from my family \u2014 my brother Harun. Strengthen my strength through him, make him share my mission.' Allah answered his prayer and made Harun a prophet at his side. Harun was known for his eloquence \u2014 where Musa had a speech impediment." },
      { title: "The Common Mission", text: "Musa and Harun confronted Pharaoh and the sorcerers together. Harun managed the people of Israel during Musa's absences on Sinai. When Musa returned and found his people worshipping the golden calf, Harun explained his helplessness: 'Son of my mother, do not seize me by my beard or my head. I feared you would say: you have divided the Israelites.'" },
      { title: "A Gentle Death on Mount Hor", text: "Harun died before reaching the Promised Land. According to tradition, he passed away peacefully on Mount Hor after Musa had accompanied him there. The Israelites, jealous, falsely accused Musa of having killed him. Harun's greatness was his total devotion to his brother's mission and to Allah's cause." }
    ] },
    { id: 16, desc: "Prophet of patience and promise", story: [
      { title: "The Man of the Promise", text: "Dhul-Kifl is mentioned twice in the Quran among the patient prophets. His name means 'one who takes charge' or 'one of the responsibility'. According to accounts, he made a solemn pledge to pray, fast and judge with equity \u2014 and he kept his promise his entire life." },
      { title: "Patience in the Face of Trials", text: "Dhul-Kifl is cited by Allah alongside Isma'il and Ayyub as an example of patience and goodness. He endured temptations and provocations without ever yielding. Allah says of him and his companions: 'We blessed them with Our mercy for they were among the righteous.'" }
    ] },
    { id: 17, desc: "Prophet, king and psalmist of Allah", story: [
      { title: "David and Goliath", text: "While the Israelite army trembled before the giant Jalut (Goliath), the young Dawud \u2014 a simple shepherd \u2014 volunteered to face him. The soldiers looked at him with scepticism. With his faith in Allah and his courage, he brought Jalut down with a single stone launched from his sling. His miraculous victory changed the course of history." },
      { title: "The Prophet King", text: "Allah granted Dawud kingship, wisdom and knowledge. He taught him to make coats of mail \u2014 a military revolution. Allah subjugated the mountains and birds that glorified Allah with Dawud. Iron softened in his hands by divine miracle to make armour." },
      { title: "The Psalms \u2014 the Zabur", text: "Allah revealed to Dawud the Zabur (the Psalms), a holy book of magnificent glorifications and prayers. His voice was of supernatural beauty \u2014 men, animals and mountains stopped to hear him recite the praises of Allah. He wept greatly out of fear of Allah and was extremely austere despite his royal power." }
    ] },
    { id: 18, desc: "The king of men, jinn and animals", story: [
      { title: "A Kingdom Without Equal", text: "Sulayman, son of Dawud, inherited the prophethood and the kingdom. He prayed to Allah: 'Lord, forgive me and grant me a kingdom that will not belong to anyone after me.' Allah granted him a unique power: mastery of the winds, the language of animals and birds, command of the jinn who built for him palaces, statues, basins and immense cauldrons." },
      { title: "The Hoopoe and the Queen of Sheba", text: "One day, the hoopoe was absent. It returned with astonishing news: 'I have seen a queen, Bilqis, who rules over Sheba with a magnificent throne, but she and her people worship the sun.' Sulayman sent her a letter beginning with Bismillah inviting her to Islam. The queen, impressed, came to see him. She embraced Islam after seeing her throne transported in the blink of an eye." },
      { title: "Death and the Jinn", text: "When Sulayman died leaning on his staff, the jinn continued working for months without knowing he was dead. Only when a worm gnawed his staff and he fell did the jinn understand. Thus Allah showed that the jinn do not know the unseen world." }
    ] },
    { id: 19, desc: "Prophet sent against the idolatry of Ba'l", story: [
      { title: "The Struggle Against the Idol Ba'l", text: "Ilyas was sent to a people who worshipped an idol called Ba'l while claiming to believe in Allah. He called them to abandon Ba'l and return to the worship of Allah alone. He said to them: 'Do you worship Ba'l and abandon the best of creators \u2014 Allah, your Lord and the Lord of your most ancient fathers?'" },
      { title: "The Rejection and the Flight", text: "His people rejected him vehemently. Ilyas was forced to flee. Allah elevated him and preserved him. The Quran says of him: 'He is indeed among Our believing servants.' His memory was preserved for future generations: 'Peace be upon Ilyas!' \u2014 a salutation that Allah Himself addresses to him in the Quran." }
    ] },
    { id: 20, desc: "Successor of the prophet Ilyas", story: [
      { title: "The Faithful Successor", text: "Al-Yasa' was the successor and disciple of the prophet Ilyas. He continued his mission among the Israelites, calling them to pure faith in Allah. The Quran places him among the best prophets: 'Al-Yasa', Dhul-Kifl \u2014 all are among the righteous.'" },
      { title: "A Prophet Among the Best", text: "Allah mentioned him in the Quran granting him a place of honour among His chosen prophets. Although the details of his life are little mentioned in Islamic texts, his place among the prophets of Ibrahim's lineage is undeniable." }
    ] },
    { id: 21, desc: "Dhul-Nun \u2014 The man of the whale", story: [
      { title: "The Hasty Departure", text: "Yunus was sent to Nineveh (present-day Mosul in Iraq), a city of more than 100,000 inhabitants. After years of fruitless preaching, he became discouraged and left his mission without divine authorisation. He boarded a ship. A terrible storm shook the vessel \u2014 the sailors drew lots to throw someone into the sea. The lot fell on Yunus." },
      { title: "In the Belly of the Whale", text: "A whale swallowed him. In triple darkness (the whale's belly, the depths of the sea, the night), Yunus invoked with sincere faith: 'There is no god but You! Glory be to You! I was among the wrongdoers!' \u2014 This is the Du'a of Yunus, one of the most powerful invocations in Islam. Allah immediately answered and the whale cast him out on a shore." },
      { title: "The Return and the Success", text: "Allah miraculously grew a plant (a gourd) over him to cover and nourish him in his weakness. Healed, Yunus returned to his mission. This time, all the people of Nineveh believed his call \u2014 100,000 people or more, according to the Quran. This was one of the greatest collective conversions in the history of the prophets." }
    ] },
    { id: 22, desc: "Guardian of Maryam and father of Yahya", story: [
      { title: "The Guardian of Maryam", text: "Zakariyya was the high priest of the Temple of Jerusalem and uncle of Maryam (Mary). He was appointed as guardian of the young Maryam. Every time he entered her prayer chamber in the temple, he found miraculous food. He asked her: 'Where does this come from?' She replied: 'It comes from Allah. Allah provides for whom He wills without limit.'" },
      { title: "The Prayer of the Desperate Old Man", text: "Moved by this miracle, Zakariyya invoked Allah: 'Lord, grant me from You a good offspring. You hear prayers.' Now Zakariyya was very old and his wife had always been barren. The angels announced to him: 'Allah gives you glad tidings of Yahya, who will confirm a word from Allah, will be a master, chaste and a prophet among the righteous.'" },
      { title: "The Sign of Silence", text: "Zakariyya asked for a sign. Allah told him: 'Your sign is that you shall not speak to people for three days.' During these three days, Zakariyya could only express himself through gestures. He spent his days glorifying Allah in silence. Then Yahya was born, fulfilling the divine promise." }
    ] },
    { id: 23, desc: "Confirmer of the Messiah \u2014 Prophet of purity", story: [
      { title: "A Unique Child", text: "Yahya was a miraculous child \u2014 born of a very old father and a barren mother by Allah's grace. He received his name directly from Allah: 'Yahya' \u2014 a name no man had borne before him. From childhood, Allah said of him: 'O Yahya, take the Book with strength!' As a child, he refused to play with his companions and preferred meditation and worship." },
      { title: "The Prophet of the Torah and of Nature", text: "Yahya lived in nature, dressed in camel hair and fed on locusts and wild honey. He was of absolute purity and asceticism. He confirmed the imminent arrival of the Messiah Issa. He called people to repent and purify themselves. The Quran describes him: 'full of kindness and piety, and dutiful toward his parents \u2014 he was never arrogant or rebellious.'" },
      { title: "A Martyr of Truth", text: "Yahya was assassinated by King Herod Antipas who had him beheaded for condemning his illicit marriage with his brother's wife. He died a martyr of truth without ever yielding. Allah granted him peace on the day of his birth, the day of his death and the day he will be resurrected." }
    ] },
    { id: 24, desc: "Ruhullah \u2014 The Spirit of Allah and His Word", story: [
      { title: "The Miraculous Birth of Maryam's Son", text: "Maryam was a pure and virgin woman, dedicated to the service of the Temple. The angel Jibril appeared to her in human form. She was frightened. The angel said: 'I am the messenger of your Lord to give you a pure son.' She asked: 'How shall I have a son when no man has touched me?' He replied: 'Thus says Allah: it is easy for Me.' Issa was born without a father \u2014 a unique miracle in history." },
      { title: "The Miracles of the Messenger", text: "Allah granted Issa extraordinary miracles: he spoke in his cradle to defend his mother's honour. He fashioned birds from clay and breathed into them \u2014 they flew away alive. He healed the blind and the lepers. He raised the dead by Allah's permission. He knew what people had eaten and stored in their homes. These miracles testified to his prophetic mission." },
      { title: "The Heavenly Table", text: "The disciples of Issa asked him: 'Can your Lord send down a table spread with food from heaven?' Issa prayed to Allah. A table laden with food descended from heaven \u2014 a sign and a feast for them. Allah warned those who would disbelieve after this sign of a unique punishment in history." },
      { title: "The Elevation and the Foretold Return", text: "Issa's enemies plotted to kill him. But Allah said: 'They did not kill him nor crucify him \u2014 it only appeared so to them.' Allah raised him alive to Himself. The Prophet Muhammad \uFDFA announced that Issa will return at the end of times, break the cross, kill the Dajjal, establish justice on Earth and die naturally." }
    ] },
    { id: 25, desc: "Khatam An-Nabiyyin \u2014 The Seal of the Prophets", story: [
      { title: "The Orphan of Mecca", text: "Muhammad \uFDFA was born in Mecca around 570 CE, the Year of the Elephant. His father Abdullah died before his birth. His mother Amina died when he was 6 years old. An orphan, he was raised first by his grandfather Abdul Muttalib then by his uncle Abu Talib. From childhood, he was known by all for his honesty and integrity \u2014 the Meccans called him Al-Amin, 'the Trustworthy.'" },
      { title: "The First Revelation \u2014 Iqra'", text: "At 40 years old, during a spiritual retreat in the cave of Hira, the angel Jibril appeared to him and pressed him three times: 'Iqra'! \u2014 Read!' Muhammad \uFDFA replied that he could not read. Jibril revealed to him the first verses of the Quran: 'Read in the name of your Lord who created \u2014 He created man from a clinging substance.' Muhammad \uFDFA returned trembling to Khadija. She comforted him and he received revelations for 23 years." },
      { title: "13 Years of Persecution in Mecca", text: "For 13 years, the Prophet \uFDFA and his Companions endured terrible persecutions in Mecca: torture, economic boycott, insults, assassination attempts. He lost his dearest loved ones: Khadija, his uncle Abu Talib. He was stoned in Ta'if until he bled. He never responded with violence, showing extraordinary patience and forgiveness." },
      { title: "The Hijra \u2014 The Turning Point of Islam", text: "In 622 CE, the Prophet \uFDFA emigrated from Mecca to Medina \u2014 this is the Hijra which marks the beginning of the Islamic calendar. In Medina, he built the first mosque, established brotherhood between the Emigrants and the Medinans, drafted the Constitution of Medina and laid the foundations of the first organised Islamic community." },
      { title: "The Conquest of Mecca \u2014 Universal Forgiveness", text: "In 630 CE, after 8 years, Muhammad \uFDFA returned to Mecca at the head of 10,000 Companions. The city surrendered without fighting. Before his former persecutors, he said these memorable words: 'What do you say I will do with you?' They replied: 'Good \u2014 you are a generous brother.' He said: 'Go \u2014 you are free!' This total forgiveness remains one of the greatest acts in human history." },
      { title: "The Farewell Sermon and the Completion of the Mission", text: "During the farewell pilgrimage in 632 CE, the Prophet \uFDFA delivered his famous speech before 114,000 Companions. He said: 'Your blood, your wealth and your honour are sacred. You will appear before your Lord. I have conveyed the message \u2014 bear witness!' A few months later, he died in Medina at 63 years old. His last words were: 'O Lord, to the Highest Companion.' He left behind the Quran and his Sunnah as guidance for all of humanity." }
    ] }
  ];
