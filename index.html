    { name: "N\xFBh \u26F5", clues: ["J'ai pr\xEAch\xE9 mon peuple pendant 950 longues ann\xE9es sans jamais abandonner.", "Sur ordre d'Allah, j'ai construit une immense arche en plein d\xE9sert \u2014 mon peuple se moquait de moi.", "J'ai embarqu\xE9 les croyants et un couple de chaque animal. Le d\xE9luge a tout submerg\xE9.", "Mon fils a refus\xE9 de monter sur l'arche et a p\xE9ri. Mon arche s'est pos\xE9e sur le mont Joudi."] },
    { name: "Ibrahim \u{1F525}", clues: ["J'ai bris\xE9 toutes les idoles de mon peuple sauf la plus grande, pour leur montrer leur absurdit\xE9.", "Le roi Nemrod m'a jet\xE9 dans un immense feu, mais Allah a ordonn\xE9 au feu d'\xEAtre frais et agr\xE9able pour moi.", "Allah m'a demand\xE9 de sacrifier mon fils \u2014 j'ai ob\xE9i, et Allah a envoy\xE9 un b\xE9lier \xE0 la derni\xE8re seconde.", "Avec mon fils Isma'il, j'ai \xE9lev\xE9 les fondations de la Ka'ba \xE0 La Mecque. Je suis le 'Khalilullah'."] },
    { name: "Isma'il \u{1F411}", clues: ["Ma m\xE8re Hajar a couru 7 fois entre Safa et Marwa pour trouver de l'eau pour moi, nourrisson.", "C'est \xE0 mes pieds que la source miraculeuse de Zamzam a jailli.", "Mon p\xE8re Ibrahim a voulu me sacrifier sur ordre d'Allah. J'ai dit : 'P\xE8re, fais ce qu'on t'ordonne.'", "J'ai aid\xE9 mon p\xE8re \xE0 construire la Ka'ba. Je suis l'anc\xEAtre des Arabes et du Proph\xE8te \uFDFA."] },
    { name: "Y\xFBsuf \u{1F451}", clues: ["Mes propres fr\xE8res jaloux m'ont jet\xE9 dans un puits, puis vendu comme esclave en \xC9gypte.", "En prison, j'ai interpr\xE9t\xE9 les r\xEAves de mes compagnons de cellule avec pr\xE9cision.", "J'ai interpr\xE9t\xE9 le r\xEAve du roi : 7 vaches grasses puis 7 maigres = 7 ans d'abondance puis famine.", "Le roi m'a nomm\xE9 ministre de l'\xE9conomie. Je me suis ensuite r\xE9v\xE9l\xE9 \xE0 mes fr\xE8res en leur pardonnant tout."] },
    { name: "M\xFBsa \u26A1", clues: ["Ma m\xE8re m'a d\xE9pos\xE9 dans un panier sur le Nil pour me sauver du Pharaon qui tuait les b\xE9b\xE9s h\xE9breux.", "J'ai grandi dans le palais royal du Pharaon sans qu'il sache qui j'\xE9tais.", "Dans la vall\xE9e de Tuwa, Allah m'a parl\xE9 depuis un buisson ardent et m'a confi\xE9 ma mission.", "J'ai frapp\xE9 la mer avec mon b\xE2ton : elle s'est fendue en deux. Le Pharaon et son arm\xE9e ont \xE9t\xE9 engloutis."] },
    { name: "Issa \u2728", clues: ["Je suis n\xE9 d'une vierge, sans p\xE8re, par le seul pouvoir de la parole d'Allah : 'Kun fayakun !'", "J'ai parl\xE9 d\xE8s le berceau pour d\xE9fendre l'honneur de ma m\xE8re Maryam.", "Avec la permission d'Allah, j'ai gu\xE9ri les aveugles, les l\xE9preux et j'ai ressuscit\xE9 des morts.", "Je suis surnomm\xE9 'Ruhullah' (Esprit d'Allah). Je reviendrai avant la fin des temps."] },
    { name: "Muhammad \uFDFA \u{1F319}", clues: ["Je suis n\xE9 \xE0 La Mecque en 570. Mon p\xE8re est mort avant ma naissance, ma m\xE8re quand j'avais 6 ans.", "On m'appelait 'Al-Amin' (le Digne de confiance) avant ma mission proph\xE9tique.", "\xC0 40 ans, l'ange Jibr\xEEl m'est apparu dans la grotte Hir\xE2 et m'a dit : 'Lis !'", "Je suis le dernier et le Sceau de tous les proph\xE8tes. Le Coran m'a \xE9t\xE9 r\xE9v\xE9l\xE9 en 23 ans."] },
    { name: "Dawud \u{1F3B5}", clues: ["J'\xE9tais un jeune berger quand j'ai affront\xE9 et tu\xE9 le g\xE9ant Goliath avec une simple fronde.", "Ma voix \xE9tait si belle que les oiseaux et les montagnes glorifiaient Allah avec moi.", "Allah m'a r\xE9v\xE9l\xE9 le Zabur (les Psaumes) et m'a rendu le fer mall\xE9able sous mes mains.", "Je suis roi et proph\xE8te. Allah dit de moi : '\xD4 David, Nous t'avons fait vicaire sur la Terre.'"] },
    { name: "Sulayman \u{1F985}", clues: ["Allah m'a accord\xE9 un royaume unique : je commandais les hommes, les djinns, les animaux et le vent.", "Je comprenais le langage des oiseaux et des fourmis. Une fourmi a alert\xE9 ses cong\xE9n\xE8res de mon arriv\xE9e !", "J'ai invit\xE9 la reine de Saba Bilqis, qui adorait le soleil, \xE0 se soumettre \xE0 Allah. Elle s'est convertie.", "Je suis le fils de Dawud. Malgr\xE9 mon immense richesse, je restais humble : 'Ceci est la gr\xE2ce de mon Seigneur.'"] },
    { name: "Yunus \u{1F40B}", clues: ["J'ai quitt\xE9 mon peuple sans la permission d'Allah, d\xE9\xE7u de leurs refus r\xE9p\xE9t\xE9s.", "Sur un navire pris dans la temp\xEAte, le sort est tomb\xE9 sur moi. J'ai \xE9t\xE9 jet\xE9 \xE0 la mer.", "Une grande baleine m'a aval\xE9. Dans ses profondeurs obscures, j'ai pri\xE9 : 'L\xE2 il\xE2ha ill\xE2 Anta, subh\xE2naka !'", "Allah a exauc\xE9 ma pri\xE8re. La baleine m'a recrach\xE9 sur une rive. Mon peuple s'est ensuite converti en masse."] },
    { name: "Ayyub \u{1F4AA}", clues: ["J'\xE9tais riche, en bonne sant\xE9, avec une grande famille. Puis Allah m'a tout pris comme \xE9preuve.", "J'ai souffert d'une terrible maladie pendant de tr\xE8s longues ann\xE9es sans jamais perdre foi.", "Ma supplication : 'Rabbi ann\xEE massaniya ad-durru wa anta arhamur-r\xE2him\xEEn' est c\xE9l\xE8bre.", "Allah m'a gu\xE9ri, a doubl\xE9 mes biens et rendu ma famille. Je suis le symbole de la patience absolue."] },
    { name: "Ibrahim P\xE8re + Isma'il \u{1F54B}", clues: ["Nous sommes p\xE8re et fils, tous deux proph\xE8tes d'Allah.", "Ensemble, nous avons construit la Ka'ba \xE0 La Mecque sur ordre d'Allah.", "Le p\xE8re a failli sacrifier son fils sur ordre divin. Le fils a accept\xE9 avec foi totale.", "Nous prions : 'Rabban\xE2 taqabbal minn\xE2 \u2014 Seigneur, accepte de nous !'"] },
    { name: "Hud \u{1F30A}", clues: ["J'ai \xE9t\xE9 envoy\xE9 au peuple 'Ad, une nation puissante et orgueilleuse qui adorait des idoles.", "Ils disaient : 'Qui est plus fort que nous ?' Moi, je les appelais \xE0 adorer Allah Seul.", "Ils ont refus\xE9 de m'\xE9couter et m'ont trait\xE9 de menteur et d'insens\xE9.", "Allah a envoy\xE9 un vent furieux pendant 7 nuits et 8 jours. Le peuple 'Ad a \xE9t\xE9 an\xE9anti."] },
    { name: "Salih \u{1F42A}", clues: ["J'ai \xE9t\xE9 envoy\xE9 au peuple Thamud qui vivait dans des maisons taill\xE9es dans la roche.", "Allah a fait sortir miraculeusement une chamelle du rocher comme signe de Sa puissance.", "J'ai averti : 'Ne faites pas de mal \xE0 cette chamelle, sinon un ch\xE2timent douloureux vous atteindra !'", "Les plus arrogants ont tu\xE9 la chamelle. Trois jours apr\xE8s, un cri terrible a d\xE9truit tout le peuple."] },
    { name: "Lut \u{1F3D9}\uFE0F", clues: ["Je suis le neveu du proph\xE8te Ibrahim. J'ai \xE9migr\xE9 avec lui depuis Ur (Irak).", "J'ai \xE9t\xE9 envoy\xE9 dans les cit\xE9s de Sodome et Gomorrhe aux m\u0153urs tr\xE8s corrompues.", "Des anges sous forme d'hommes sont venus chez moi. Les habitants voulaient leur faire du mal.", "Les anges m'ont dit : 'Pars cette nuit avec ta famille !' Les cit\xE9s ont \xE9t\xE9 renvers\xE9es et d\xE9truites."] },
    { name: "Ya'qub \u{1F31F}", clues: ["Je suis le fils d'Is'haq et le petit-fils d'Ibrahim. Je suis surnomm\xE9 'Isra\xEBl'.", "J'ai 12 fils qui formeront les 12 tribus d'Isra\xEBl. Mon fils pr\xE9f\xE9r\xE9 s'appelle Y\xFBsuf.", "Quand mes fils ont pr\xE9tendu que Y\xFBsuf avait \xE9t\xE9 mang\xE9 par un loup, j'ai refus\xE9 de les croire.", "J'ai pleur\xE9 si fort la disparition de Y\xFBsuf que j'ai perdu la vue. Elle m'est revenue \xE0 son retour."] },
    { name: "Maryam \u{1F338}", clues: ["Je suis la seule femme mentionn\xE9e nomm\xE9ment dans le Coran, dans une sourate enti\xE8re \xE0 mon nom.", "Je me suis consacr\xE9e enti\xE8rement \xE0 l'adoration d'Allah depuis toute petite, sous la garde de Zakariyya.", "L'ange Jibr\xEEl m'est apparu et m'a annonc\xE9 que j'allais avoir un enfant sans qu'aucun homme me touche.", "Je suis la m\xE8re du proph\xE8te Issa. Ma vertu et ma puret\xE9 sont cit\xE9es en exemple dans le Coran."] },
    { name: "Zakariyya \u{1F33A}", clues: ["Je suis proph\xE8te et gardien de Maryam dans le temple. Je lui apportais de la nourriture.", "Vieux et dont la femme \xE9tait st\xE9rile, j'ai quand m\xEAme suppli\xE9 Allah de me donner un fils.", "Ma dou'a : 'Rabbi habl\xEE min ladunka dhurriyyatan tayyibatan \u2014 Seigneur, donne-moi une bonne descendance.'", "Allah m'a annonc\xE9 la naissance d'un fils : Yahya. Je m'en suis \xE9tonn\xE9 mais j'ai remerci\xE9 Allah."] },
    { name: "Yahya \u{1F4A7}", clues: ["Mon p\xE8re est le proph\xE8te Zakariyya. Ma naissance fut un miracle : mes parents \xE9taient trop vieux.", "Je suis le seul \xE0 porter ce pr\xE9nom \u2014 Allah dit : 'Nous n'avons donn\xE9 ce pr\xE9nom \xE0 personne avant lui.'", "Allah m'a dit : '\xD4 Yahya, tiens fermement le Livre.' J'ai re\xE7u la sagesse d\xE8s l'enfance.", "Je suis connu pour ma pi\xE9t\xE9, ma puret\xE9 et mon respect envers mes parents. Je ne suis pas arrogant."] },

  const RIHLA_KEY = "rihla_progress";
  const LIVES_KEY = "rihla_lives";
  const LIVES_MAX = 5;
  const LIVES_REGEN_MS = 2 * 60 * 60 * 1000;

  const getRihlaProgress = () => {
    try { return JSON.parse(localStorage.getItem(RIHLA_KEY) || "{}"); }
    catch { return {}; }
  };

  const saveRihlaProgress = (data) => {
    try { localStorage.setItem(RIHLA_KEY, JSON.stringify(data)); } catch {}
  };

  const getLivesData = () => {
    try {
      const d = JSON.parse(localStorage.getItem(LIVES_KEY) || "null");
      if (!d) return { lives: LIVES_MAX, lastRegen: Date.now() };
      const now = Date.now();
      const regenCount = Math.floor((now - d.lastRegen) / LIVES_REGEN_MS);
      if (regenCount > 0) {
        d.lives = Math.min(LIVES_MAX, d.lives + regenCount);
        d.lastRegen = d.lastRegen + regenCount * LIVES_REGEN_MS;
      }
      return d;
    } catch { return { lives: LIVES_MAX, lastRegen: Date.now() }; }
  };

  const saveLivesData = (data) => {
    try { localStorage.setItem(LIVES_KEY, JSON.stringify(data)); } catch {}
  };

  const getMedal = (pts) => {
    if (pts >= 360) return { icon: "🥇", label: "Or", color: "#ffd700" };
    if (pts >= 280) return { icon: "🥈", label: "Argent", color: "#c0c0c0" };
    if (pts >= 200) return { icon: "🥉", label: "Bronze", color: "#cd7f32" };
    return null;
  };

  const canUnlock = (stageId, progress) => {
    if (stageId === 1) return true;
    const prev = progress["etape" + (stageId - 1)];
    if (!prev || prev.best < 200) return false;
    if (stageId >= 3) {
      const prev2 = progress["etape" + (stageId - 2)];
      if (!prev2 || prev2.best < 360) return false;
    }
    return true;
  };

  var COMPAGNONS_EN = [
    { n:1, surnom: "As-Siddiq (the Truthful)", role: "1st Caliph of Islam", groupe: "10 of Paradise",
      bio: "Abu Bakr was the Prophet's \uFDFA closest friend long before the Islamic revelation. As soon as the Prophet \uFDFA told him about Islam, he believed immediately without hesitation \u2014 hence his title 'As-Siddiq'. He was the first free adult man to embrace Islam. He devoted his entire fortune to the cause of Islam, buying tortured slaves for their faith such as Bilal ibn Rabah. During the Hijra, he was the sole companion of the Prophet \uFDFA in the cave of Thawr for 3 days. Becoming the 1st Caliph, he stabilised the Muslim community, compiled the Quran into a single book and fought the false prophets.",
      hadith: "The Prophet \uFDFA said: 'If I were to take a close friend among people, it would be Abu Bakr.' (Bukhari)" },
    { n:2, surnom: "Al-Faruq (he who distinguishes truth from falsehood)", role: "2nd Caliph of Islam", groupe: "10 of Paradise",

      hadith: "The Prophet \uFDFA said: 'If a prophet were to come after me, it would be Omar ibn Al-Khattab.' (Tirmidhi)" },
    { n:3, surnom: "Dhul-Nurayn (the one with two lights)", role: "3rd Caliph of Islam", groupe: "10 of Paradise",
      bio: "Uthman was a wealthy merchant known for his generosity and modesty. He successively married two daughters of the Prophet \uFDFA \u2014 hence his title. At the campaign of Tabuk, he alone financed a third of the army. Becoming Caliph, he accomplished the capital work of standardising the Quran into a single official copy sent throughout the Islamic world. His 12-year caliphate saw Islam extend to Iran, Armenia and North Africa.",
      hadith: "The Prophet \uFDFA said: 'The angels are shy before Uthman \u2014 so how should we not be shy before him?' (Muslim)" },
    { n:4, surnom: "Asadullah (Lion of Allah)", role: "4th Caliph \u2014 Cousin and son-in-law of the Prophet \uFDFA", groupe: "10 of Paradise",
      bio: "Ali grew up in the Prophet's \uFDFA home from childhood. At only 10 years old, he was the first child to embrace Islam. On the night of the Hijra, he slept in the Prophet's \uFDFA bed to deceive the assassins, risking his life. A great warrior, he distinguished himself in the battles of Badr, Uhud and Khaybar. Husband of Fatima and father of Al-Hassan and Al-Husayn. A great scholar, the Prophet \uFDFA told him: 'I am the city of knowledge and you are its gate.' He was assassinated during the Fajr prayer by Ibn Muljam.",
      hadith: "The Prophet \uFDFA said: 'I am the city of knowledge and Ali is its gate.' (Tirmidhi)" },
    { n:5, surnom: "Talha Al-Khayr (Talha the Good)", role: "Great Companion \u2014 Hero of Uhud", groupe: "10 of Paradise",
      bio: "Talha was among the first to embrace Islam and endured great persecutions. During the battle of Uhud, he performed a heroic act: he protected the Prophet's \uFDFA body with his own person, receiving more than 70 wounds from arrows, spears and swords. He lost the use of his arm but never stopped fighting. The Prophet \uFDFA said that day: 'Talha has earned Paradise!' Also known for his extreme generosity, he distributed entire fortunes to the poor.",
      hadith: "The Prophet \uFDFA said on the day of Uhud: 'Talha has earned Paradise!' (Tirmidhi)" },
    { n:6, surnom: "Hawari An-Nabi (Apostle of the Prophet)", role: "Cousin of the Prophet \uFDFA \u2014 Great warrior", groupe: "10 of Paradise",

      hadith: "The Prophet \uFDFA said: 'Every prophet has an apostle, and my apostle is Az-Zubayr ibn Al-Awwam.' (Bukhari)" },
    { n:7, surnom: "The very generous one", role: "Great merchant \u2014 Among the first Muslims", groupe: "10 of Paradise",
      bio: "Abdurrahman emigrated to Medina with nothing. On arrival, an Ansari offered to share his fortune. He refused with dignity and said: 'Just show me the marketplace.' Through his intelligence, he quickly rebuilt a great fortune. He financed many expeditions and distributed considerable sums to the poor. One day, a caravan of 700 camels loaded with merchandise arrived in Medina \u2014 he distributed it entirely in charity for Allah.",
      hadith: "He wept one day seeing his wealth: 'I fear my reward has been given to me in advance in this world.'" },
    { n:8, surnom: "First archer of Islam", role: "Great warrior \u2014 Conqueror of Persia", groupe: "10 of Paradise",
      bio: "Sa'd was the first to fire an arrow in defence of Islam. The Prophet \uFDFA cherished him: 'Fire, may my father and mother be sacrificed for you!' \u2014 the only words the Prophet \uFDFA used to honour someone in this way. Sa'd was also known for his invocations answered by Allah. A great military commander, he conquered the Persian empire and founded the city of Kufa, which became a major centre of Islamic civilisation.",
      hadith: "The Prophet \uFDFA said: 'Fire Sa'd! I sacrifice myself for you!' and 'O Allah, answer Sa'd when he supplicates You.' (Tirmidhi)" },
    { n:9, surnom: "", role: "Great Companion \u2014 Brother-in-law of Omar ibn Al-Khattab", groupe: "10 of Paradise",
      bio: "Sa'id ibn Zayd was the brother-in-law of Omar ibn Al-Khattab. He embraced Islam very early in Mecca, before even the Hijra, at a time when this required exceptional courage. He endured the persecutions of the Quraysh with patience. A faithful participant in almost all the battles of Islam alongside the Prophet \uFDFA, he was known for his deep piety, righteousness and modesty. He was among the ten Companions to whom Paradise was announced by name by the Prophet \uFDFA in a single famous hadith.",
      hadith: "The Prophet \uFDFA announced: 'Abu Bakr is in Paradise, Omar is in Paradise... and Sa'id ibn Zayd is in Paradise.' (Abu Dawud)" },
    { n:10, surnom: "Amin Al-Umma (Trustworthy of the community)", role: "Great general \u2014 Conqueror of the Levant", groupe: "10 of Paradise",
      bio: "Abu Ubayda was known for his absolute integrity. During Uhud, he pulled with his teeth the rings of the helmet embedded in the Prophet's \uFDFA cheeks, losing his own teeth in the act. A great general, he led the conquest of the Levant (Syria, Palestine, Lebanon). In 639 CE, a terrible plague epidemic struck Syria. Abu Ubayda refused to flee and stayed with his sick soldiers until his own death. His humility was legendary \u2014 he lived in a nearly empty house despite his rank.",
      hadith: "The Prophet \uFDFA said: 'Every community has a trustworthy man, and the trustworthy man of this community is Abu Ubayda.' (Bukhari)" },
    { n:11, surnom: "First Muezzin of Islam", role: "Freed slave \u2014 First Muezzin", groupe: "Great Companions",
      bio: "Bilal was an Ethiopian slave subjected to horrific torture for his faith \u2014 stretched out on burning sand with a boulder placed on his chest. Despite the pain, he ceaselessly repeated: 'Ahad! Ahad!' (One alone!) Abu Bakr bought and freed him. The Prophet \uFDFA chose him as Islam's first Muezzin. During the conquest of Mecca, he climbed onto the roof of the Ka'ba to call to prayer \u2014 a powerful symbol of Islam's victory over injustice.",
      hadith: "The Prophet \uFDFA told him: 'I heard the sound of your sandals before me in Paradise last night.' (Bukhari)" },
    { n:12, surnom: "Ummul Mu'minin (Mother of the Believers)", role: "First wife of the Prophet \uFDFA \u2014 First Muslim woman", groupe: "Great Companions",
      bio: "Khadija was a prosperous and respected widow who proposed marriage to the Prophet \uFDFA after observing his exceptional righteousness. When he returned trembling from the cave of Hira after the first revelation, she comforted him with these immortal words: 'Allah will never let you down. You are good to your family, you bear the burdens of others, you honour your guests and you uphold the truth.' She was the first to believe in him, devoting her entire fortune to Islam. Her death was an immense trial for the Prophet \uFDFA who never ceased to mention her with love.",
      hadith: "The Prophet \uFDFA said: 'She believed me when others called me a liar. She supported me with her wealth when others deprived me.' (Bukhari)" },
    { n:13, surnom: "Ummul Mu'minin \u2014 Mother of the Believers", role: "Wife of the Prophet \uFDFA \u2014 Greatest female scholar", groupe: "Great Companions",
      bio: "Aisha, daughter of Abu Bakr, grew up in the Prophet's \uFDFA household and became one of the most learned women in Islam. She transmitted more than 2000 hadiths. The Companions came to consult her to resolve their most delicate religious questions. Her memory was prodigious. The Prophet \uFDFA died in her arms, his head resting on her chest. After his death, she continued for decades to teach Islam to men and women. She lived until 64, leaving an invaluable scientific heritage.",
      hadith: "The Prophet \uFDFA said: 'Take half of your religion from this humayr\xE2 (redhead).' (Bukhari)" },
